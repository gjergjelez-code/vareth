  return-1}
 // Tas binaire (cases, coûts) du calcul en cours
 function push(c,k){let i=hn++;while(i>0){const p=(i-1)>>1;if(hk[p]<=k)break;hp[i]=hp[p];hk[i]=hk[p];i=p}hp[i]=c;hk[i]=k}
 function pop(){const c=hp[0];pk=hk[0];hn--;
  if(hn>0){const c2=hp[hn],k2=hk[hn];let i=0;for(;;){let l=2*i+1;if(l>=hn)break;if(l+1<hn&&hk[l+1]<hk[l])l++;if(hk[l]>=k2)break;hp[i]=hp[l];hk[i]=hk[l];i=l}hp[i]=c2;hk[i]=k2}
  return c}
 // Demande le champ de la destination k (une seule fois) ; la file garde les 8 dernières demandes
 function req(k){
  for(let i=0;i<qn;i++)if(qk[i]==k)return;
  if(js>=0&&jk==k)return;
  if(qn==Q){qk.copyWithin(0,1);qn--}
  qk[qn++]=k}
 // Lance le calcul du champ k dans l’emplacement le moins utilisé
 function begin(k){
  if(!hp){hp=new Int32Array(9*NN);hk=new Int32Array(9*NN)}
  let s=0;for(let i=1;i<F;i++)if(ft[i]<ft[s])s=i;
  const f=fd[s]||(fd[s]=new Int32Array(NN));
  fk[s]=k;fr[s]=0;ft[s]=++tk;f.fill(INF);f[k]=0;hn=0;push(k,0);js=s;jk=k}
 // Voisin de coût restant le plus bas (même règle de passage que le calcul : pas de coupe de coin) ; -1 si aucun
 function down(f,c){
  const x=c%NC,y=(c/NC)|0;let b=-1,bv=f[c];
  for(let j=0;j<8;j++){
   const nx=x+DX[j],ny=y+DY[j];if(nx<0||ny<0||nx>=NC||ny>=NC)continue;
   const m=ny*NC+nx;if(!sp[m])continue;
   if(j>3&&(!sp[y*NC+nx]||!sp[ny*NC+x]))continue;
   if(f[m]<bv){bv=f[m];b=m}}
  return b}
 // Champ prêt pour la destination k : celui que u suit déjà s’il vise à 2 cases près, sinon celui de la mémoire ; le calcul est demandé s’il manque (en attendant, u garde son ancien champ) ; 0 si rien
 function getf(u,k){
  const s=u.ns;
  if(s>=0&&fk[s]==u.nk&&fr[s]){const dx=u.nk%NC-k%NC,dy=((u.nk/NC)|0)-((k/NC)|0);if(dx*dx+dy*dy<=8){ft[s]=++tk;return fd[s]}}
  for(let i=0;i<F;i++)if(fk[i]==k){if(fr[i]){ft[i]=++tk;u.ns=i;u.nk=k;return fd[i]}break}
  req(k);
  if(s>=0&&fk[s]==u.nk&&fr[s]){ft[s]=++tk;return fd[s]}
  return 0}
 const hold=u=>{u.wx=u.x;u.wy=u.y;u.wd=0};
 // Point de passage de u vers (tx,ty) en suivant le champ f : la corde est tirée au plus loin où la ligne droite ne coûte pas plus de 6 de plus que le chemin du champ ; l = coût de la ligne jusqu’à (tx,ty)
 function way(u,f,tx,ty,l){
  const c0=ci(u.x,u.y),d0=f[c0];
  if(d0>=INF)return 0;
  if(l>=0&&l<=d0+6){u.wx=tx;u.wy=ty;u.wd=1;return 1}
  let c=c0,b=-1,c1=-1;
  for(let k=0;k<14;k++){
   const m=down(f,c);if(m<0)break;
   if(c1<0)c1=m;c=m;
   const q=lin(u.x,u.y,cx(c),cy(c));
   if(q>=0&&q<=d0-f[c]+6)b=c;
   if(!f[c])break}
  if(b<0)b=c1;
  if(b<0){u.wx=tx;u.wy=ty;u.wd=l>=0?1:0;return 1}   // déjà dans la case de la destination
  u.wx=cx(b);u.wy=cy(b);u.wd=0;return 1}
 // Choisit le point de passage vers (x,y) ; renvoie le délai avant le prochain calcul (secondes de jeu)
 function plan(u,x,y){
  let tx=x,ty=y,k=ci(x,y);u.sn=0;
  if(!sp[k]){k=snap(k);if(k<0){hold(u);return .5}tx=cx(k);ty=cy(k);u.sn=1}
  const l=lin(u.x,u.y,tx,ty),dl=.25+(u.id%4)*.04;
  if(l>=0&&pur){u.wx=tx;u.wy=ty;u.wd=1;return dl}   // ligne droite libre, terrain normal : pas de champ
  const f=getf(u,k);
  if(!f){if(l>=0){u.wx=tx;u.wy=ty;u.wd=1}else hold(u);return .08}   // champ en calcul : droit devant si la ligne est libre, sinon on attend
  if(way(u,f,tx,ty,l))return dl;
  hold(u);return .5}
 // Unité dans une case bloquée (apparition au bord de l’eau) : sort vers la case libre la plus proche
 function esc(u,c,dt){
  const k=snap(c);if(k<0)return 0;
  const dx=cx(k)-u.x,dy=cy(k)-u.y,l=Math.sqrt(dx*dx+dy*dy)||1,m=Math.min(l,u.sp*dt*.6);
  u.x+=dx/l*m;u.y+=dy/l*m;return 0}
 // Remplit la carte : eau du ruisseau (terrain.js) puis zones de la carte ; remet les champs à zéro
 V.make=M=>{
  const nv=Terrain.nv();
  sp.fill(100);bb.fill(0);if(nv)sp.set(nv);
  for(const[g,x,y,rx,ry]of M.zn||[]){
   const v=g=='neige'||g=='mont'||g=='vase'?40:0,b=g=='neige'||g=='vase'?0:1;   // eau : bloquée par le dessin du lac (Terrain.nv), ici seulement sans bâtiment
   for(let j=Math.max(0,(y-ry)/C|0);j<=Math.min(NC-1,(y+ry)/C|0);j++)for(let i=Math.max(0,(x-rx)/C|0);i<=Math.min(NC-1,(x+rx)/C|0);i++){
    const dx=((i+.5)*C-x)/rx,dy=((j+.5)*C-y)/ry;if(dx*dx+dy*dy<=1){if(g!='eau'&&(!v||!nv||nv[j*NC+i]))sp[j*NC+i]=v;bb[j*NC+i]=b}}}
  V.on=0;nb=0;for(let i=0;i<NN;i++){if(sp[i]<100)V.on=1;if(bb[i])nb=1}
  fk.fill(-1);fr.fill(0);ft.fill(0);qn=0;js=-1;hn=0;tk=0};
 // Une tranche de calcul (appelée à chaque image de partie) : au plus BUD cases, puis le champ est prêt
 V.step=()=>{
  if(js<0){if(!qn)return;const k=qk[0];qk.copyWithin(0,1);qn--;begin(k)}
  const f=fd[js];let n=BUD;
  while(n>0&&hn>0){
   n--;const c=pop(),d=pk;if(d>f[c])continue;
   const x=c%NC,y=(c/NC)|0,v0=sp[c];
   for(let j=0;j<8;j++){
    const nx=x+DX[j],ny=y+DY[j];if(nx<0||ny<0||nx>=NC||ny>=NC)continue;
    const m=ny*NC+nx,v=sp[m];if(!v)continue;
    if(j>3&&(!sp[y*NC+nx]||!sp[ny*NC+x]))continue;
    const nd=d+Math.round((j>3?2800:2000)/(v0+v));   // 14 ou 10 × 200 / (v0 + v)
    if(nd<f[m]){f[m]=nd;push(m,nd)}}}
  if(!hn){fr[js]=1;js=-1}};
 // Nouvel ordre de marche : repart de zéro ; une destination bloquée est ramenée sur la case libre la plus proche
 V.go=u=>{
  if(!V.on)return;
  u.wt=0;u.ns=u.nk=-1;u.sn=0;
  const k=ci(u.tx,u.ty);if(!sp[k]){const m=snap(k);if(m>=0){u.tx=cx(m);u.ty=cy(m)}}};
 // Déplace u vers (x,y) à r près (d = distance déjà calculée) ; renvoie 1 à l’arrivée (voir mv, engine.js)
 V.mv=(u,x,y,r,dt,d)=>{
  if(u.wt===undefined){u.wt=0;u.ns=u.nk=-1;u.wx=u.x;u.wy=u.y;u.wd=u.sn=0}
  const c=ci(u.x,u.y);
  if(!sp[c])return esc(u,c,dt);
  if((u.wt-=dt)<=0)u.wt=plan(u,x,y);
  else if(u.wd&&!u.sn){u.wx=x;u.wy=y}
  const wx=u.wx-u.x,wy=u.wy-u.y,wl=Math.sqrt(wx*wx+wy*wy);
  if(u.sn&&u.wd&&wl<3)return 1;   // arrivé au plus près d’une destination en zone bloquée
  if(wl<.5)return 0;
  let m=u.sp*dt*sp[c]/100;if(u.wd&&m>d-r)m=d-r;if(m>wl)m=wl;
  if(m<=0)return 0;
  let nx=u.x+wx/wl*m,ny=u.y+wy/wl*m;
  if(!sp[ci(nx,ny)]){   // garde-fou : jamais dans une case bloquée, on glisse le long de l’obstacle
   if(sp[ci(nx,u.y)])ny=u.y;else if(sp[ci(u.x,ny)])nx=u.x;else{u.wt=0;return 0}}
  if(wx>2||wx<-2)u.fx=wx<0?-1:1;
  u.x=nx;u.y=ny;return 0};
 // Ramène une entité née dans une case bloquée (unité au bord de l’eau, ressource dans le ruisseau) sur la case libre la plus proche ; renvoie o
 V.fix=o=>{
  if(!V.on)return o;
  const c=ci(o.x,o.y);
  if(!sp[c]){const k=snap(c);if(k>=0){o.x=cx(k)+(c*7%11-5);o.y=cy(k)+(c*13%11-5);if(o.tx!==undefined){o.tx=o.x;o.ty=o.y}}}
  return o};
 // Vrai si la ligne droite de a à b ne traverse aucune case bloquée ; sans calcul si b est à plus de g pixels (near le rejette déjà)
 V.sees=(a,b,g)=>!V.on||Math.abs(a.x-b.x)>g||Math.abs(a.y-b.y)>g||lin(a.x,a.y,b.x,b.y)>=0;
 // Vrai si un bâtiment de rayon r posé en (x, y) toucherait une zone sans bâtiment (lave, montagne, lac)
 V.ban=(x,y,r)=>{
  if(!nb)return 0;
  const q=(r+C*.7)*(r+C*.7);
  for(let j=Math.max(0,(y-r)/C|0);j<=Math.min(NC-1,(y+r)/C|0);j++)for(let i=Math.max(0,(x-r)/C|0);i<=Math.min(NC-1,(x+r)/C|0);i++)
   if(bb[j*NC+i]){const dx=(i+.5)*C-x,dy=(j+.5)*C-y;if(dx*dx+dy*dy<q)return 1}
  return 0};
 // Vitesse du terrain en (x, y) : 0 à 1
 V.spd=(x,y)=>sp[ci(x,y)]/100;
 V.dbg={fd,fk,fr};   // champs de flux, pour les tests (nav_test.js)
 return V})();
</script>

 * Compétence « massue » : toutes les rc secondes, quand une unité ennemie est dans la zone, le monstre se fige tm secondes (levée, visible : zone qui pulse, sprite qui monte), puis frappe le sol : toutes les unités ennemies dans la zone sont étourdies s secondes.

 * Regain : à chaque unité tuée au corps à corps, le monstre regagne rg % de ses PV max.
 * Carte de vie (HUD, boss.css) : portrait, PV, recharge de la massue ; l'objectif guidé est masqué tant qu'elle est affichée.
 * Utilisé par engine.js (tick : stn · mêlée : hit · init : reset · loop : step, hud, won, lost · endGame : es), renderer.js (pix, draw), ui.js (hr), essai.js (make, es), test.js (make).

 // La massue s'abat : étourdit les unités ennemies dans la zone, onde de choc, son

<script>
/* home.js — écran d'accueil « Crépuscule » : scène pixel art (ciel, soleil, Forum en flammes, titre) et boutons.

const home=(()=>{
 const{m:M,surf,RC,disc,circ,dots,pbtn,tw,ctext,ico,cico,chip,mix,bay,rng,fbm,spU,spB,spT,spr,tint,btn,pw}=Px;

 function scene(S,L){const{w,h,cx,ox,hor}=L,X=d=>Math.round(cx+d);
  for(let y=0;y<hor;y++)for(let x=0;x<w;x++){const t=Math.pow(y/hor,1.3)*(SKY.length-1),k=Math.min(SKY.length-2,Math.floor(t)),f=t-k;RC(S,x,y,1,1,f>bay(x,y)?SKY[k+1]:SKY[k])}
  const r=rng(11);for(let i=0,n=Math.round(46*w/131);i<n;i++){const x=Math.floor(r()*w),y=Math.floor(r()*(hor-70));RC(S,x,y,1,1,r()<.3?'#ffe9b4':'#b9a8d8');if(r()<.12){RC(S,x-1,y,3,1,'#ffe9b4',.6);RC(S,x,y-1,1,3,'#ffe9b4',.6)}}
  disc(S,X(32),hor-6,26,'#f9b25a');disc(S,X(32),hor-6,22,'#ffd877');disc(S,X(32),hor-6,18,'#fff1a6');
  const hill=(base,amp,sc,seed,col)=>{for(let x=0;x<w;x++){const t=Math.round(base+(fbm((x-ox)*sc,seed,seed)-.5)*2*amp);RC(S,x,t,1,h-t,col)}};
  hill(hor-2,7,.045,2,'#6b3262');hill(hor+10,6,.06,5,'#3f2350');hill(hor+24,4,.08,9,'#241a30');
  const g0=hor+36;for(let y=g0;y<h;y++)for(let x=0;x<w;x++)if(bay(x,y)<(y-g0)/(h-g0))RC(S,x,y,1,1,'#171222');
  for(const[d,y,sc]of[[-57.5,36,12],[-43.5,42,9],[-29.5,40,9],[30.5,36,9],[44.5,40,12],[58.5,42,9]])tree(S,X(d),hor+y,sc);
  for(let d=72.5,k=0;d<cx+10;d+=14,k++){const sc=k%2?9:12;tree(S,X(-d),hor+36+(k%3)*3,sc);tree(S,X(d),hor+38+(k%3)*3,sc)}   // forêt qui continue sur les écrans larges
  bld(S,'h',X(-41.5),hor+60,9,.88);bld(S,'h',X(40.5),hor+62,9,.88);bld(S,'tc',cx,hor+60,15,.84);
  RC(S,X(-13.5),hor+48,5,5,'#ffb23a');RC(S,X(7.5),hor+48,5,5,'#ffb23a');RC(S,X(-5.5),hor+50,10,10,'#ff7a2a');RC(S,X(-3.5),hor+53,6,7,'#ffd25a');
  for(let i=0;i<20;i++){const s=3+Math.floor(i/5);RC(S,cx-1.5+i*1.3+Math.sin(i*.8)*3,hor+16-i*5,s,s,mix('#3a2f45','#8a7a9c',i/20),.6-i*.026)}
  for(const[d,y,sc]of[[-8.5,10,2],[2.5,6,2],[-19.5,22,1],[14.5,20,1],[-11.5,38,1],[10.5,39,1],[-45.5,50,1],[35.5,52,1],[-37.5,48,1]])flame(S,X(d),hor+y,sc);
  dots(S,Math.round(58*w/131),8,['#ffb04a','#ff7a2f','#ffd25a','#e8452b'],40,hor+46,10,w-8,.2);
  chip(S,ox+123-(12+tw(String(SV.g),1)),L.yI-3,SV.g);
  title(S,cx,L.yT);if(CFG.tag)ctext(S,'V.'+CFG.ver+CFG.tag,cx,L.yV,1,'#ff6b6b',{sh:DK,shDy:1})}

 function build(root){const L=lay(),r=pw(root),S=surf(M.w,M.h,M.s),{cx,ox}=L;
  scene(S,L);S.cv.className='hs';r.appendChild(S.cv);
  // icônes du haut : paramètres, son, infos
  const top=(id,label,x,icon,go)=>{const b=btn(r,ox+x-11,L.yI-11,22,22,T=>{disc(T,11,11,10,NIGHT,.55);circ(T,11,11,10,1,CREAM,.9);cico(T,icon(),11,11,1,CREAM,INK)},label,id);b.onclick=go;return b};
  top('set','Paramètres',15,()=>'gear',()=>settingsScreen(0));   // ces écrans remplacent l’accueil ; leur « Retour » le réaffiche
  const sn=top('snd','Son',40,()=>Snd.on?'spk':'spkoff',()=>{Snd.toggle();sn.draw()});
  top('info','Informations',62,()=>'info',()=>infoScreen());
  top('ach','Succès',84,()=>'cup',()=>Ach.screen());   // succès (succes.js)
  // JOUER
  btn(r,Math.round(cx-32.5),L.yP,67,27,T=>{pbtn(T,0,0,65,24,{fill:'#b8431f',hi:'#d9633a',lo:'#8a2d14',out:DK});ico(T,'play',13,6,1,'#ffe9b4',DK);ctext(T,'JOUER',38,7,1,'#ffe9b4',{sh:DK,shDy:1})},'Jouer','play').onclick=()=>campaign();
  // REPRENDRE : une partie de campagne interrompue (reprise.js)
  if(typeof Rep!='undefined'&&Rep.has())btn(r,Math.round(cx-32.5),L.yP-22,67,20,T=>{pbtn(T,0,2,65,13,{fill:'#2f6b2a',hi:'#3f8a38',lo:'#1d451a',out:DK});ctext(T,'REPRENDRE',33,5,1,'#e8ffd0',{sh:DK,shDy:1})},'Reprendre la partie','rep').onclick=()=>Rep.resume();
  // ESSAI (mode test seulement) : la salle d’essai (essai.js)
  // INFINI (après la victoire au niveau 5, ou en mode test) : vagues sans fin (infini.js)
  const inf=typeof Inf!='undefined'&&((SV.d[4]|0)>0||typeof Test!='undefined'&&Test.on);
  if(inf){btn(r,Math.round(cx-36.5),L.yP+27,36,20,T=>{pbtn(T,0,2,34,13,{fill:'#2f5d57',hi:'#3f7a72',lo:'#1d3c38',out:DK});ctext(T,'INFINI',17,5,1,'#ffe9b4',{sh:DK,shDy:1})},'Mode infini','in').onclick=()=>Inf.start();
   btn(r,Math.round(cx+.5),L.yP+27,36,20,T=>{pbtn(T,0,2,34,13,{fill:'#6a4a1a',hi:'#8a6a2a',lo:'#3e2a0e',out:DK});ctext(T,'DÉFI',17,5,1,'#ffe9b4',{sh:DK,shDy:1})},'Défi du jour','df').onclick=()=>Defi.screen()}   // défi du jour (defi.js)
  if(typeof Test!='undefined'&&Test.on&&typeof Essai!='undefined')btn(r,Math.round(cx-32.5),L.yP+(inf?48:27),67,20,T=>{pbtn(T,0,2,65,13,{fill:'#6b1f2a',hi:'#8f2f3d',lo:'#45121a',out:DK});ico(T,'skull',17,5,1,'#ffd0d0',DK);ctext(T,'ESSAI',42,5,1,'#ffd0d0',{sh:DK,shDy:1})},'Salle d\'essai','es').onclick=()=>Essai.screen();
  // Skins et Améliorations, en bas de chaque côté
  const cy=M.h-28-L.bb,low=(id,label,d,draw,go)=>btn(r,Math.round(cx+d)-22,cy-11,44,34,T=>{disc(T,22,11,11,NIGHT,.78);circ(T,22,11,11,1,CREAM,.9);draw(T);ctext(T,label.toUpperCase().replace('AMÉLIORATIONS','AMÉLIO.'),22,26,1,'#ffe9b4',{sh:DK,shDy:1})},label,id).onclick=go;
  low('skins','Skins',-35.5,T=>spr(T,spU(3),16,4,6),()=>skinsScreen());
  low('up','Améliorations',35.5,T=>cico(T,'up',22,11,2,'#f2c230',INK),()=>upgradesScreen())}

 return m=>{$('ov').style.display='none';if(typeof Daily!='undefined'&&Daily.auto(m))return;Px.show(build);   // cadeau du jour (quotidien.js) : sa fiche passe avant l'accueil, une fois par lancement
 if(m)toast(m);setTimeout(()=>campaign.warm(),600)};
})();
</script>
<script>
/* campaign.js — carte de campagne « Archipel » : 50 niveaux, fiche de niveau, étoiles.
 * Script classique : définit campaign(m) ; m = message éventuel affiché en bandeau (résultat d'une partie).
 * Ordre de chargement : après pix.js et home.js, avant ui.js.
 * Utilise, à l'exécution :
 *   pix.js : Px · engine.js : SV · levels.js : LV, TI, lvl, tierStars, bestStars · ui.js : home, startLevel, toast
 * Aujourd'hui 4 niveaux sont jouables (LV), chacun à 3 paliers (TI) ; les niveaux 5 à 50 sont des icônes : le premier non terminé est « courant », le reste verrouillé.
 * Fiche de niveau : trois boutons de palier (x1 Amateur, x2 Intermédiaire, x4 Difficile) ; un palier s'ouvre en gagnant le précédent (SV.d[i] = paliers gagnés).
 * Étoiles par palier : 1 = victoire · 2 = sans perdre de bâtiment · 3 = en plus, en moins de lvl(i, t).tt secondes de jeu. La carte montre le meilleur résultat des paliers.
 * La carte est générée une fois (terrain, décor, bannières de chapitre) puis gardée ; les niveaux se redessinent par-dessus à chaque ouverture.
 */
const campaign=(()=>{
 const{m:M,surf,RC,disc,circ,ell,pbtn,text,ctext,tw,wrap,ico,cico,chip,mix,bay,rng,hs,fbm,U,spB,spT,spr,btn,pw}=Px;
 const N=50,INK='#241c0c',CREAM='#f6efd8',GOLD='#f2c230',DIM='#5a5468',STAR='#ffd23a',
 NAMES=['I - LE VAL','II - FORÊT','III - PLAINES','IV - MONTS','V - CENDRES'];

 // ---------- tracé : zigzag lissé, 50 nœuds à intervalle régulier le long du chemin ----------
 function makePath(w){const rise=54,half=13,xl=24,xr=107,margin=46,jit=6,r=rng(8),H=margin*2+rise*half,ox=Math.floor((w-131)/2),Q=[];
  for(let k=0;k<=half;k++)Q.push([(k%2?xr:xl)+Math.round((r()-.5)*2*jit)+ox,H-margin-k*rise+Math.round((r()-.5)*jit)]);
  const cr=(p0,p1,p2,p3,t)=>[0,1].map(i=>.5*((2*p1[i])+(-p0[i]+p2[i])*t+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*t*t+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*t*t*t));
  const pts=[];for(let k=0;k<Q.length-1;k++){const p0=Q[Math.max(0,k-1)],p1=Q[k],p2=Q[k+1],p3=Q[Math.min(Q.length-1,k+2)];for(let t=0;t<1;t+=.02)pts.push(cr(p0,p1,p2,p3,t))}pts.push(Q[Q.length-1]);
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=cum[cum.length-1];
  const at=s=>{let i=1;while(i<cum.length-1&&cum[i]<s)i++;const t=(s-cum[i-1])/((cum[i]-cum[i-1])||1);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t]};
  const nodes=[];for(let i=0;i<N;i++){const[x,y]=at(L*i/(N-1));nodes.push({i:i+1,x:Math.round(x),y:Math.round(y),s:L*i/(N-1)})}
  // frontières des 5 chapitres (Val, Forêt, Plaines, Monts, Cendres) : entre les niveaux 10-11, 20-21, 30-31, 40-41
  return{H,pts,nodes,L,at,ox,yb:[1,2,3,4].map(k=>(nodes[10*k-1].y+nodes[10*k].y)/2)}}

 // ---------- terrain : archipel (mer, plages, îles) avec un biome par chapitre ----------
 const GR=['#a3e05a','#96d64f','#6fb83a'];
 const land=(b,x,y,n,mm,h)=>{
  if(b==0)return h<.035?GR[2]:n>.5?GR[0]:GR[1];
  if(b==1)return h<.05?'#33702a':n>.5?'#4d8e39':'#468534';
  if(b==2){if(n>.62)return h<.04?GR[2]:GR[0];if(mm>.58&&((y>>1)&1))return'#cdb95a';return h<.03?'#c9b255':n>.5?'#e1cf74':'#e6d47c'}
  if(b==3){if(n<.36)return h<.04?GR[2]:GR[1];if(n>.6)return mm>.5?'#f0eafb':'#dcd1f0';if(n>.57)return'#c4b8e0';return h<.05?'#7b768b':n>.5?'#9d98ab':'#928da0'}
  const q=Math.abs(fbm(x*.085,y*.085,77)-.5),lv=fbm(x*.045,y*.045,91);
  if(lv>.75)return'#ffb23a';if(lv>.7)return'#d6402b';if(q<.014)return'#ef7b2f';if(q<.022)return'#a04a2a';if(h<.02)return'#5a5463';
  return mm>.62?'#4b4553':n>.5?'#3d3744':'#352f3c'};
 // Les bruits sont calculés autour du centre (x − ox) : la partie centrale est identique sur tous les écrans, les bords s'élargissent.
 function terrain(w,P,K){const H=P.H,n=w*H,ox=P.ox,dN=new Float32Array(n).fill(99),dP=new Float32Array(n).fill(99),ld=new Uint8Array(n),BI=new Uint8Array(n);
  const stamp=(a,cx,cy,R)=>{for(let y=Math.max(0,Math.floor(cy-R));y<=Math.min(H-1,Math.ceil(cy+R));y++)for(let x=Math.max(0,Math.floor(cx-R));x<=Math.min(w-1,Math.ceil(cx+R));x++){const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy),i=y*w+x;if(d<a[i])a[i]=d}};
  for(const q of P.nodes)stamp(dN,q.x,q.y,22);for(let i=0;i<P.pts.length;i+=3)stamp(dP,P.pts[i][0],P.pts[i][1],14);
  for(let y=0;y<H;y++)for(let x=0;x<w;x++){const i=y*w+x,xx=x-ox,nn=fbm(xx*.05,y*.05,3),mm=fbm(xx*.12,y*.12,9);   // terre = autour des niveaux et du chemin, plus quelques îles
   ld[i]=(dN[i]<14+6*(mm-.5)||dP[i]<8.5+4*(mm-.5)||nn>.52)?1:0;
   const yy=y+(bay(x,y)-.5)*7+(fbm(xx*.04,y*.04,13)-.5)*14;let b=0;for(const t of P.yb)if(yy<t)b++;BI[i]=b}
  const bfs=src=>{const d=new Uint8Array(n).fill(255),q=new Int32Array(n);let qh=0,qt=0;for(let i=0;i<n;i++)if(src[i]){d[i]=0;q[qt++]=i}
   while(qh<qt){const i=q[qh++];if(d[i]>=9)continue;const x=i%w,y=(i/w)|0;
    if(x+1<w&&d[i+1]==255){d[i+1]=d[i]+1;q[qt++]=i+1}if(x>0&&d[i-1]==255){d[i-1]=d[i]+1;q[qt++]=i-1}
    if(y+1<H&&d[i+w]==255){d[i+w]=d[i]+1;q[qt++]=i+w}if(y>0&&d[i-w]==255){d[i-w]=d[i]+1;q[qt++]=i-w}}return d};
  const dw=bfs(ld.map(v=>v?0:1)),dl=bfs(ld),px=new Uint32Array(n);   // distance à l'eau (sur terre) et à la terre (en mer) : plages et écume
  for(let y=0;y<H;y++)for(let x=0;x<w;x++){const i=y*w+x,b=BI[i],xx=x-ox,nn=fbm(xx*.06,y*.06,11),mm=fbm(xx*.17,y*.17,23),h=hs(xx,y,5);let c;
   if(!ld[i]){const d=dl[i];c=d<=1?'#cdeff0':d==2?'#8fd3e6':'#58afe0';if(d>2&&h<.014)c='#86c4ee'}
   else{const d=dw[i];if(d<=1)c='#f6ec9a';else if(d<=2&&b<3)c=h<.06?'#e3cb58':'#f0de72';else if(d<=2)c='#d9d2e8';else c=land(b,xx,y,nn,mm,h)}
   px[i]=U(c)}
  const t1=surf(w,H,1);t1.g.putImageData(new ImageData(new Uint8ClampedArray(px.buffer),w,H),0,0);
  const S=surf(w,H,K);S.g.drawImage(t1.cv,0,0,w*K,H*K);return{S,px,BI}}

 // ---------- décor : arbres, sommets, arbres morts, hameaux (jamais sur le chemin, un niveau ou son étiquette) ----------
 const peak=(S,x,y,w,h)=>{for(let r=0;r<h;r++){const half=Math.round((r+1)*(w/2)/h),yy=y+r;RC(S,x-half,yy,half*2+1,1,r<h*.3?'#f0eafb':'#aaa4b8');RC(S,x,yy,half+1,1,r<h*.3?'#cfc3e6':'#8a859b');RC(S,x-half,yy,1,1,'#5a5468');RC(S,x+half,yy,1,1,'#5a5468')}RC(S,x-Math.round(w/2),y+h-1,w+1,1,'#5a5468')};
 const dead=(S,x,y)=>{RC(S,x,y,1,8,'#1f1612');RC(S,x-2,y+2,2,1,'#1f1612');RC(S,x+1,y+3,3,1,'#1f1612');RC(S,x-3,y+1,1,2,'#1f1612');RC(S,x+3,y+1,1,2,'#1f1612')};
 function decor(S,P,px,BI,w){const H=P.H,r=rng(6),placed=[],pts=P.pts.filter((_,i)=>i%3==0),items=[];
  const free=(x,y,rad,sp)=>{if(x<5||x>w-5||y<8||y>H-8)return false;
   for(const p of pts){const dx=p[0]-x,dy=p[1]-y;if(dx*dx+dy*dy<rad*rad)return false}
   for(const q of P.nodes){const dx=q.x-x,dy=q.y-y;if(dx*dx+dy*dy<rad*rad)return false;if(Math.abs(dx)<13&&y>q.y-6&&y<q.y+24)return false}
   for(const q of placed){const dx=q[0]-x,dy=q[1]-y;if(dx*dx+dy*dy<sp*sp)return false}return true};
  const put=(n,type,bio,rad,sp)=>{for(let k=0;k<n;k++){const x=4+r()*(w-8),y=8+r()*(H-16),b=BI[(y|0)*w+(x|0)];if(Array.isArray(bio)?!bio.includes(b):b!=bio)continue;
   const c=px[Math.round(y)*w+Math.round(x)],cr=c&255,cg=(c>>8)&255,cb=(c>>16)&255;if(cb>cr+20&&cb>cg)continue;if(cr>230&&cg>225)continue;   // ni dans l'eau ni sur la plage
   if(!free(x,y,rad,sp))continue;placed.push([x,y]);items.push([type,Math.round(x),Math.round(y)])}};
  put(900,'tree',1,13,6.5);put(200,'tree',0,16,18);put(300,'peak',3,13,15);put(300,'dead',4,12,9);put(60,'house',[0],16,30);
  items.sort((a,b)=>a[2]-b[2]);
  for(const[t,x,y]of items){if(t=='tree')spr(S,spT(),x-4,y-8,4);else if(t=='peak')peak(S,x,y,13+(x*7%7),9+(y*3%6));else if(t=='dead')dead(S,x,y);else spr(S,spB('h'),x-5,y-4,3)}}

 // ---------- bannières de chapitre : placées au plus près de la frontière, hors du chemin et des niveaux ----------
 const ribbon=(S,x,y,s)=>{const wd=tw(s,1)+8;RC(S,x,y,wd,11,INK);RC(S,x+1,y+1,wd-2,9,'#16302d');RC(S,x+1,y+1,wd-2,1,mix('#16302d','#ffffff',.25));ctext(S,s,x+wd/2,y+2,1,CREAM)};
 function ribbons(S,P){const ys=[P.nodes[0].y+13,...P.yb],obs=[];
  for(const q of P.nodes){obs.push([q.x,q.y,q.i%10==0?11:9]);if(q.i%10==0)obs.push([q.x,q.y+11,7]);if(q.i<=2)obs.push([q.x,q.y+10,8])}
  ys.forEach((yy,k)=>{const wd=tw(NAMES[k],1)+8,Y=Math.round(yy);let best=[P.ox+3,Y-5],bs=-99;
   for(let x0=P.ox+3;x0<=P.ox+131-wd-3;x0+=3)for(let y0=Y-64;y0<=Y+50;y0+=3){if(y0<4||y0>P.H-16)continue;let sc=99;
    for(const[ox,oy,rr]of obs){const dx=Math.max(x0-ox,0,ox-(x0+wd)),dy=Math.max(y0-oy,0,oy-(y0+11));sc=Math.min(sc,Math.sqrt(dx*dx+dy*dy)-rr)}
    for(const p of P.pts){const dx=Math.max(x0-p[0],0,p[0]-(x0+wd)),dy=Math.max(y0-p[1],0,p[1]-(y0+11));sc=Math.min(sc,Math.sqrt(dx*dx+dy*dy)-2)}
    sc=Math.min(sc,6)-Math.abs(y0+5-Y)*.06;if(sc>bs){bs=sc;best=[x0,y0]}}
   ribbon(S,best[0],best[1],NAMES[k])})}

 // Carte complète (mise en cache pour une largeur et une échelle données)
 let C=null;
 const kOf=s=>s%3==0?3:s%4==0?4:s%2==0?2:s<=7?s:3;   // pixels de canvas par pixel logique : diviseur de M.s, pour un rendu net
 const get=()=>{const w=M.w,K=kOf(M.s);if(C&&C.w==w&&C.K==K)return C;
  const P=makePath(w),T=terrain(w,P,K),S=T.S;decor(S,P,T.px,T.BI,w);
  const a=P.nodes[0],z=P.nodes[N-1];spr(S,spB('tc'),a.x+8,a.y+8,6);spr(S,spB('c',1),z.x-15,z.y-30,9);   // Forum du Val au départ, citadelle de Korvan à l'arrivée
  ribbons(S,P);return C={w,K,P,S}};

 // ---------- niveaux : chemin pointillé, pastilles, étoiles ----------
 const cur=()=>{let k=0;while(k<N&&SV.d[k])k++;return k};   // indice du niveau courant (= nombre de niveaux terminés)
 const stateOf=(i,k)=>i<k?{s:'done',st:Math.max(1,bestStars(i))}:i==k?{s:'cur'}:{s:'lock'};
 function node(S,q,st){const boss=q.i%10==0,r=boss?8:6,x=q.x,y=q.y;
  const pal=st.s=='done'?['#3e8f3a','#5db554']:st.s=='cur'?['#c98a12','#f2c230']:boss?['#7a2e26','#a64637']:['#555b6e','#7a8197'];
  ell(S,x,y+r+1,r,2,'#000',.28);disc(S,x,y,r+1,INK);disc(S,x,y,r,pal[0]);disc(S,x,y-1,r-2,pal[1]);RC(S,x-r+3,y-r+3,2,1,'#ffffff',.55);
  if(st.s=='cur'){circ(S,x,y,r+4,1,CREAM,.9);circ(S,x,y,r+7,1,CREAM,.4)}
  if(st.s=='lock'){if(boss){cico(S,'skull',x,y,1,'#f0e2d0',INK);ctext(S,String(q.i),x,y+r+3,1,CREAM,{out:INK,outT:1})}else cico(S,'lock',x,y,1,CREAM,INK)}
  else{ctext(S,String(q.i),x,y-3,1,st.s=='cur'?INK:CREAM,st.s=='cur'?{}:{sh:'#1d4d1c',shDy:1});
   if(st.s=='done')for(let j=0;j<3;j++)ico(S,'star5',x-8+j*6,y+r+3,1,j<st.st?STAR:'#6a6578',INK)}}
 // Flèche au-dessus du niveau courant ; décalée si elle toucherait un niveau voisin
 function arrow(S,P,k){const q=P.nodes[k],r=q.i%10==0?8:6,
  hit=(cx,cy)=>P.nodes.some(o=>o!=q&&Math.hypot(Math.max(Math.abs(cx-o.x)-4,0),Math.max(Math.abs(cy-o.y)-3,0))<(o.i%10==0?10:8)),
  c=[[0,-r-11],[-9,-r-9],[9,-r-9],[0,-r-18]].find(([dx,dy])=>!hit(q.x+dx,q.y+dy+2))||[0,-r-11];
  ico(S,'down',q.x+c[0]-3,q.y+c[1],1,STAR,INK)}
 function paintNodes(S,P,k){for(let s=1;s<P.L;s+=4){const[x,y]=P.at(s),d=P.nodes.filter(q=>q.s<=s).length<=k;RC(S,x,y,2,2,'#000',.22);RC(S,x-1,y-1,2,2,d?'#ffe27a':'#fffaf0',d?1:.92)}   // chemin : doré jusqu'au niveau courant
  for(const q of P.nodes)node(S,q,stateOf(q.i-1,k));
  if(k<N)arrow(S,P,k)}

 // ---------- fiche de niveau ----------
 // Dessine la fiche : poignée, titre, adversaire, objectif, cadre du palier choisi (sel) et son nom, les 3 critères d'étoiles du palier (allumées si obtenues), gloire du palier.
 // oy = marge haute (poignée). Renvoie {h : hauteur du panneau, by : haut des boutons de palier, py : haut du bouton JOUER} ; les boutons sont des <button> posés par-dessus (open).
 function art(S,i,real,sel,oy){const Lv=LV[i]||{},A=ADV[Lv.ad|0];
  RC(S,55,0,21,3,CREAM);RC(S,0,oy,131,S.h-oy,CREAM);RC(S,1,oy+1,129,S.h-oy-1,'#16302d');RC(S,1,oy+1,129,1,'#2f5d57');
  text(S,'NIVEAU '+(i+1),10,oy+9,2,GOLD,{sh:INK});
  if(!real){text(S,'À VENIR',10,oy+29,1,'#8fa8a3');cico(S,'lock',65.5,oy+46,2,CREAM,INK);ctext(S,'BIENTÔT DISPONIBLE',65.5,oy+62,1,CREAM);return{h:116,py:oy+80}}
  const P=lvl(i,sel);let y=oy+44;
  text(S,Lv.n.toUpperCase(),10,oy+29,1,CREAM);
  if(Lv.ad){RC(S,10,y,26,28,INK);RC(S,11,y+1,24,26,'#0f2220');RC(S,11,y+1,24,1,'#2f5d57');spr(S,spA(Lv.ad),12,y+2,6);   // adversaire : portrait, nom, titre
   text(S,'ADVERSAIRE',42,y+1,1,'#8fa8a3');text(S,A.n.toUpperCase(),42,y+11,1,CREAM);text(S,A.t.toUpperCase(),42,y+21,1,GOLD);y+=34;
   text(S,Lv.ob?(Lv.ob.k=='tenir'?'TIENS '+Lv.ob.t/60+' MIN':'GAGNE EN '+Lv.ob.t/60+' MIN'):'DÉTRUIS SON FORUM',10,y,1,Lv.ob?GOLD:CREAM);y+=14}   // objectif spécial (levels.js, ob)
  else{for(const l of wrap('DÉTRUIS LE FORUM DE '+A.n.toUpperCase(),111)){text(S,l,10,y,1,CREAM);y+=10}y+=4}
  const by=y;RC(S,8+sel*38,by-2,39,24,GOLD);ctext(S,TI[sel].n.toUpperCase(),65.5,by+26,1,CREAM);y+=40;   // cadre doré du palier choisi (les boutons sont posés par-dessus) et son nom
  ['VICTOIRE','0 BÂTIMENT PERDU','MOINS DE '+Math.round(P.tt/60)+' MIN'].forEach((s,j)=>{ico(S,'star5',10,y+j*10,1,tierStars(i,sel)>j?STAR:DIM,INK);text(S,s,22,y+j*10-1,1,CREAM)});y+=32;
  ico(S,'crown',10,y+1,1,GOLD,INK);text(S,'+'+(sel<(SV.d[i]|0)?P.gl>>1:P.gl)+' GLOIRE',24,y,1,GOLD);y+=14;   // gloire : moitié si le palier est déjà gagné
  return{h:y+36-oy,by,py:y}}
 // Bouton du palier j (35 × 20, posé 4 px plus bas : la coche dépasse en haut à droite) : couleur du palier, cadenas s'il n'est pas ouvert (d = paliers gagnés), coche s'il est gagné
 const CHK='......#|.....##|#...##.|##.##..|.###...|..#....'.split('|'),
 chk=(S,x,y,c)=>CHK.forEach((q,j)=>{for(let i=0;i<7;i++)if(q[i]=='#')RC(S,x+i,y+j,1,1,c)}),
 tier=(j,d)=>T=>{const t=TI[j];
  if(j<=d){pbtn(T,0,4,35,20,{fill:t.c,hi:t.hi,lo:t.lo,out:INK});ctext(T,'x'+t.k,17.5,8,2,CREAM,{sh:INK,shDy:1})}
  else{pbtn(T,0,4,35,20,{fill:'#3a4054',hi:'#4b5268',lo:'#2a2f3e',out:INK});cico(T,'lock',17.5,13,1,'#8a93a8',INK)}
  if(j<d){disc(T,31,5,5,INK);disc(T,31,5,4,'#3e8f3a');chk(T,28,3,CREAM)}};

 // ---------- écran ----------
 function build(root){const C=get(),P=C.P,k=cur(),u=M.u,ox=Math.floor((M.w-131)/2),hy=Math.max(22,M.t+12);let sh=null,dim=null;
  // carte défilante (défilement natif) : terrain, puis niveaux par-dessus
  const mv=document.createElement('div'),mc=document.createElement('div'),Sn=surf(M.w,P.H,C.K);
  mv.className='mv';mc.className='mc';mc.style.cssText='margin-left:'+M.x+'px;width:'+M.w*u+'px;height:'+P.H*u+'px';
  paintNodes(Sn,P,k);C.S.cv.className='mt';Sn.cv.className='mn';mc.append(C.S.cv,Sn.cv);mv.appendChild(mc);root.appendChild(mv);
  mv.scrollTop=Math.max(0,P.nodes[Math.min(k,N-1)].y*u-mv.clientHeight*.62);   // le niveau courant arrive vers le bas de l'écran
  // retour et gloire, fixes par-dessus la carte
  const h=pw(root),gl=String(SV.g),cw=12+tw(gl,1)+2;
  const close=()=>{if(!sh)return;const s=sh;sh=null;dim.remove();dim=null;s.classList.remove('on');setTimeout(()=>s.remove(),170)};
  const fd=document.createElement('div');fd.style.cssText='position:absolute;left:0;right:0;top:0;pointer-events:none;height:calc(var(--u)*'+(hy+18)+');background:linear-gradient(rgba(12,18,34,.85),rgba(12,18,34,.55) 55%,rgba(12,18,34,0))';h.appendChild(fd);   // dégradé sombre sous Retour et gloire : la carte qui défile passe dessous sans gêner
  btn(h,ox+3,hy-11,22,22,T=>{disc(T,11,11,10,INK,.55);circ(T,11,11,10,1,CREAM,.9);cico(T,'left',11,11,1,CREAM,INK)},'Retour','back').onclick=()=>sh?close():home();
  const pc=document.createElement('div'),Sc=surf(cw,9,M.s);pc.className='pc';
  pc.style.cssText='left:calc(var(--u)*'+(ox+123-(12+tw(gl,1))-1)+');top:calc(var(--u)*'+(hy-4)+');width:calc(var(--u)*'+cw+');height:calc(var(--u)*9)';
  chip(Sc,1,1,SV.g);pc.appendChild(Sc.cv);h.appendChild(pc);
  // coffres d’étoiles (coffre.js) : bouton sous la gloire, pastille rouge = coffres prêts
  if(typeof Chest!='undefined'){const nk=Chest.ready();btn(h,ox+102,hy+7,22,20,T=>{disc(T,11,10,10,INK,.55);Chest.draw(T,11,15,1,0);if(nk){disc(T,18,4,4,'#c0281a');ctext(T,String(Math.min(nk,9)),18,1,1,CREAM)}},nk?'Coffres : '+nk+' prêts':'Coffres','chest').onclick=()=>Chest.screen()}
  // fiche d'un niveau : 1 à 4 jouables, à 3 paliers (le prochain à jouer est choisi d'office) ; plus loin, « bientôt disponible »
  const open=i=>{close();const real=i<LV.length,d=real?SV.d[i]|0:0,oy=4;let sel=Math.min(d,2);
   const lo=art(surf(131,330,M.s),i,real,sel,oy),H=oy+lo.h+Math.max(0,M.b-5);   // 1er dessin hors écran : mesure la fiche
   dim=document.createElement('div');dim.className='sd';dim.onclick=close;root.insertBefore(dim,h);
   sh=document.createElement('div');sh.className='sh';sh.dataset.i=i;sh.style.cssText='left:calc(var(--u)*'+ox+');width:calc(var(--u)*131);height:calc(var(--u)*'+H+')';
   const S=surf(131,H,M.s);art(S,i,real,sel,oy);sh.appendChild(S.cv);
   if(real)[0,1,2].forEach(j=>btn(sh,10+j*38,lo.by-4,37,24,tier(j,d),'Palier '+TI[j].n+', x'+TI[j].k+(j>d?' : verrouillé':j<d?' : gagné':''),'t'+j).onclick=()=>{
    if(j>d){toast('Termine d’abord le palier '+TI[j-1].n);return}
    if(j!=sel){Snd.play('clic');sel=j;S.g.clearRect(0,0,S.cv.width,S.cv.height);art(S,i,real,sel,oy)}});   // autre palier : la fiche se redessine
   const b=btn(sh,23,lo.py,87,27,T=>{
    if(real){pbtn(T,0,0,85,24,{fill:'#d2a13a'});ico(T,'play',11,6,1,'#fff3a8',INK);ctext(T,'JOUER',50,7,1,INK)}
    else{pbtn(T,0,0,85,24,{fill:'#5a5468',hi:'#7a7488',lo:'#3e3a4c'});ctext(T,'BIENTÔT',42.5,7,1,'#a9a3b8')}},real?'Jouer':'Bientôt',real?'go':'soon');
   if(real)b.onclick=()=>startLevel(i,sel);else b.disabled=true;
   h.appendChild(sh);void sh.offsetHeight;sh.classList.add('on')};
  mc.onclick=e=>{const r=mc.getBoundingClientRect(),x=(e.clientX-r.left)/u,y=(e.clientY-r.top)/u;let bi=-1,bd=1e9;
   for(const q of P.nodes){const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;bi=q.i-1}}
   if(bd>11)return;Snd.play('clic');if(bi>k)toast('Termine d’abord le niveau '+(k+1));else open(bi)}}

 const campaign=m=>{$('ov').style.display='none';Px.show(build);if(m)toast(m)};
 campaign.warm=()=>{get()};
 campaign.nodes=()=>get().P.nodes;   // pour les tests
 campaign.cur=cur;
 return campaign;
})();
</script>
<script>
/* screens.js — écrans pixel art « Parchemin » : Skins, Réglages (et pause), Forge (améliorations), Aide, Progrès (technologies, en partie), Résultat de partie, fiche du niveau avant une pub entre les parties.
 * Script classique : définit screens et les fonctions globales skinsScreen(m), settingsScreen(g, m), upgradesScreen(m), infoScreen(m).
 * m = message de l’accueil à conserver (affiché au retour) ; g = 1 en partie (jeu en pause : reprise, Recommencer, Quitter), 0 depuis l’accueil.
 * Ordre de chargement : après pix.js, home.js, campaign.js ; avant ui.js (voir index.html).
 * Utilise, à l’exécution :
 *   pix.js : Px · engine.js : $, MX, SV, init, run, save · skins.js : SKINS, skinEquip, skinOwn, skinUnlock
 *   settings.js : CFG, opt, vibOk, vibOn, vibSet · audio.js : Snd · home.js : home · ui.js : consentScreen, toast
 *   engine.js (écran Progrès) : R, era, run · tech.js : Tech · ages.js : Ages · army.js : Arm
 *   engine.js (écran Résultat) : SV · levels.js : LV, TI, tierStars · ui.js : startLevel · campaign.js : campaign · ads.js : Ads · adv.js (fiche de pub) : ADV, spA
 * Chaque écran = fond (ciel du soir + feuille de parchemin, dessinés une fois) + fenêtre défilante dans la feuille (.sv) + Retour et gloire.
 * Quand tout tient dans la feuille (iPhone 15) il n’y a pas de défilement ; sur un écran plus court, la fenêtre défile.
 * Les cartes et boutons sont des <button> dont l’image est un canvas (Px.btn) ; un achat ou un équipement reconstruit l’écran (défilement conservé).
 */
const screens=(()=>{
 const{m:M,surf,RC,disc,circ,ell,tw,wrap,text,ctext,ico,cico,isz,pbtn,chip,bay,rng,hs,fbm,spU,spB,spr,btn,pw}=Px;
 const INK='#241c0c',CREAM='#f6efd8',
 C={ink:'#3b2a14',dim:'#7a6232',gold:'#a8791c',acc:'#a8381b',line:'#b79a62'},
 K={pri:{fill:'#8a2d14',hi:'#b0462a',lo:'#5e1c0c',out:'#3b1608',tx:'#f6e7c1'},   // principal (rouge cire)
  gold:{fill:'#c8933a',out:'#3b2a14',tx:'#3b2a14'},                              // achat, choix
  ok:{fill:'#4b7a3a',hi:'#6a9a52',lo:'#335528',out:'#2a3a1c',tx:'#eef6d8'},    // validé
  dis:{fill:'#cdbb8c',hi:'#d9c99d',lo:'#b9a577',out:'#a89468',tx:'#8d7a50'},    // indisponible
  ink:{fill:'#5a4020',hi:'#7a5a30',lo:'#3b2a14',out:INK,tx:'#f6e7c1'}},          // neutre (brun)
 SKY=['#150f2e','#241748','#3b2160','#5c2a68','#8a3866','#b84d5c','#dc6a4c','#f2914a'],
 CW=115;   // largeur du contenu (pixels logiques)

 // ---------- fond : ciel du soir assombri, étoiles, feuille de parchemin entre deux rouleaux ----------
 const skyG=(S,a,b,hy,dark)=>{const{w,h}=M;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=a*Math.pow(y/h,b),i=Math.min(SKY.length-2,Math.floor(t)),f=t-i;RC(S,x,y,1,1,f>bay(x,y)?SKY[i+1]:SKY[i])}
  const r=rng(5);for(let i=0,n=Math.round(40*w/131);i<n;i++)RC(S,Math.floor(r()*w),Math.floor(r()*hy),1,1,r()<.3?'#ffe9b4':'#b9a8d8');
  if(dark)RC(S,0,0,w,h,'#0b0816',.45)};
 const sky=S=>skyG(S,4.2,1.15,M.h-84,1);
 const sheet=(S,x,y,w,h)=>{RC(S,x+2,y+3,w,h,'#000',.3);RC(S,x,y,w,h,'#4a3016');
  for(let j=1;j<h-1;j++)for(let i=1;i<w-1;i++){const d=Math.min(i,j,w-1-i,h-1-j),n=fbm(i*.12,j*.12,5);let c=n>.55?'#ecdcb0':n<.4?'#f3e6c2':'#f0e2b9';if(hs(i,j,3)<.05)c='#e2cf9e';
   if(d<5&&(5-d)/5*.9>bay(i,j)+(fbm(i*.3,j*.3,8)-.5)*.5)c=d<2?'#7a5a2e':'#a98550';RC(S,x+i,y+j,1,1,c)}
  for(const ry of[y-4,y+h-2]){RC(S,x-3,ry,w+6,6,'#3b2410');RC(S,x-2,ry+1,w+4,4,'#8b5a2b');RC(S,x-2,ry+1,w+4,1,'#b07a3c');RC(S,x-2,ry+4,w+4,1,'#5c3a1a');RC(S,x-5,ry+1,3,4,'#3b2410');RC(S,x+w+2,ry+1,3,4,'#3b2410')}};

 // ---------- éléments de dessin (coordonnées logiques) ----------
 // Bouton en relief avec icône et texte centrés ; k = pri | gold | ok | dis | ink
 const kb=(S,x,y,w,h,label,k,icon)=>{const p=K[k];pbtn(S,x,y,w,h,{fill:p.fill,hi:p.hi,lo:p.lo,out:p.out});
  const iw=icon?isz(icon)[0]+3:0,gx=x+Math.floor((w-iw-tw(label,1))/2);
  if(icon)ico(S,icon,gx,y+Math.floor((h-2-isz(icon)[1])/2)+1,1,p.tx);
  text(S,label,gx+iw,y+Math.floor((h-9)/2),1,p.tx)};
 // Bouton DOM autour de kb : zone de toucher agrandie de py (haut, bas) et px (côtés) ; spec() → {t, k, i} relu à chaque dessin
 const hb=(par,x,y,w,h,spec,id,aria,py=1,px=0)=>btn(par,x-px,y-py,w+2+2*px,h+3+2*py,S=>{const o=spec();kb(S,px,py,w,h,o.t,o.k,o.i)},aria,id);
 const card=(S,x,y,w,h,sel)=>{RC(S,x,y,w,h,sel?'#a8381b':'#b79a62');RC(S,x+1,y+1,w-2,h-2,'#e9d9ae');RC(S,x+1,y+1,w-2,1,'#f6ecc9');if(sel)RC(S,x+2,y+2,w-4,h-4,'#a8381b',.25)};
 const head=(S,x,y,w,s)=>{text(S,s,x,y,1,C.acc);RC(S,x+tw(s,1)+4,y+3,w-tw(s,1)-4,1,C.line)};
 const sw=(S,x,y,on,dis)=>{const w=32,h=11,kx=on?x+w-10:x+1;RC(S,x,y,w,h,INK);RC(S,x+1,y+1,w-2,h-2,on?'#3e8f3a':'#85734a');
  RC(S,kx,y+1,9,h-2,CREAM);RC(S,kx,y+h-3,9,2,'#c9bf9f');text(S,on?'OUI':'NON',on?x+3:x+13,y+2,1,on?'#e8ffe0':CREAM);if(dis)RC(S,x,y,w,h,'#e9d9ae',.5)};
 const up=s=>s.toUpperCase().replace(/’/g,"'");

 // ---------- cadre commun ----------
 // Positions (pixels logiques). Sur 131 × 284 : feuille de 40 à 276, fenêtre de 66 à 270 (204 de haut) ; ailleurs elles suivent l’écran et ses zones sûres.
 const lay=()=>{const{w,h,t,b}=M,ox=Math.floor((w-131)/2),hy=Math.max(22,t+12),sy=hy+18,sb=h-8,vt=sy+26,vb=Math.min(sb-6,h-b-2);return{ox,hy,sy,sb,vt,vh:vb-vt}};
 // Pastille de gloire (couronne + nombre n) en haut à droite de r
 const gchip=(r,ox,hy,n)=>{const gl=String(n),cw=12+tw(gl,1)+2,pc=document.createElement('div'),Sc=surf(cw,9,M.s);pc.className='pc';
  pc.style.cssText='left:calc(var(--u)*'+(ox+123-(12+tw(gl,1))-1)+');top:calc(var(--u)*'+(hy-4)+');width:calc(var(--u)*'+cw+');height:calc(var(--u)*9)';
  chip(Sc,1,1,n);pc.appendChild(Sc.cv);r.appendChild(pc)};
 let keep=-1,BG=null;   // défilement à rétablir après une reconstruction ; dernier fond dessiné (clé → surface)
 // o = { title, gl (1 = gloire), back, build(mc, vh, o) → hauteur du contenu }
 function frame(root,o){const L=lay(),r=pw(root),ox=L.ox,key=[o.title,M.s,M.w,M.h,M.t,M.b].join();
  if(!BG||BG.key!=key){const S=surf(M.w,M.h,M.s);sky(S);sheet(S,ox+4,L.sy,123,L.sb-L.sy);
   ctext(S,o.title,ox+65.5,L.sy+10,2,'#a8381b',{sh:'#d8c28a',shDy:1,bold:1,track:1});BG={key,S}}
  BG.S.cv.className='hs';r.appendChild(BG.S.cv);
  const sv=document.createElement('div'),mc=document.createElement('div');
  sv.className='sv';sv.style.cssText='left:calc(var(--u)*'+(ox+8)+');top:calc(var(--u)*'+L.vt+');width:calc(var(--u)*'+CW+');height:calc(var(--u)*'+L.vh+')';
  mc.className='mc';sv.appendChild(mc);r.appendChild(sv);
  const H=Math.max(L.vh,o.build(mc,L.vh,o));
  mc.style.cssText='width:calc(var(--u)*'+CW+');height:calc(var(--u)*'+H+')';
  if(keep>=0){sv.scrollTop=keep;keep=-1}
  btn(r,ox+3,L.hy-11,22,22,T=>{disc(T,11,11,10,INK,.55);circ(T,11,11,10,1,CREAM,.9);cico(T,'left',11,11,1,CREAM,INK)},'Retour','back').onclick=o.back;
  if(o.gl)gchip(r,ox,L.hy,SV.g);
  return{sv,mc}}
 // Affiche l’écran décrit par o ; o.again() le reconstruit en gardant le défilement (après un achat, un équipement)
 const open=o=>{let F;const bd=root=>{F=frame(root,o)};o.again=()=>{keep=F.sv.scrollTop;Px.show(bd)};$('ov').style.display='none';Px.show(bd)};
 const deco=(mc,H)=>{const D=surf(CW,H,M.s);D.cv.style.height='calc(var(--u)*'+H+')';mc.appendChild(D.cv);return D};   // calque fixe sous les boutons ; hauteur fixée à H (sinon étiré à la fenêtre quand H < vh, et décalé des boutons)

 // ---------- Skins ----------
 // Carte 57 × 64 : deux soldats à la couleur de la skin, nom, bouton (équipée / équiper / prix)
 const skinCard=(S,s,st)=>{const cx=28.5;card(S,0,0,57,64,st=='eq');
  ell(S,cx,27,18,3,'#000',.28);ell(S,cx,27,18,3,s.d,.85,true);ell(S,cx,26,18,3,s.c,.95,true);

 */
const Inf=(()=>{
 const{open,deco,card,hb,C,CW}=screens.kit,{text,ctext,tw}=Px,BX=[1,2,0,4,5,3,7,8,6,10,11,9,13,14,12];   // ordre des monstres : 2 champions puis le boss, chapitre par chapitre

 start=()=>{beginLevel(0,0);X.on=1;ai=-1e9;w=0;nx=90;E=E.filter(o=>!(o.m==1&&o.t=='v'));const e=E.find(o=>o.t=='tc'&&o.m==1);if(e)e.hp=e.mh=1e12;toast('Mode infini : tiens le plus de vagues possible')},

  if(T>=nx){w++;nx=T+45;const e=E.find(o=>o.t=='tc'&&o.m==1),f=E.find(o=>o.t=='tc'&&!o.m);if(!e||!f)return;const n=3+2*w,k=1+.08*w;
   for(let i=0;i<n;i++){const t=i%3==2?'a':'s',u=unit(t,1,e.x+(i%6)*18-45,e.y+e.sz/2+30+(i/6|0)*16,w>=4&&i%5==0);u.hp*=k;u.mh*=k;u.at*=k;mvTo(u,f.x,f.y,1)}

<script>
/* tips.js — conseils du tutoriel : chaque conseil s’affiche une seule fois (SV.tp : clés vues), au bon moment, dans le message du bas (toast).
 * Vérifié une fois par seconde de jeu (engine.js, loop → step). Script classique, chargé après histoire.js.
 * Utilise : engine.js (E, T, R, era, run, end, L, SV, save, cap, pop, Nav) · ui.js (toast) · adv.js (ADV)
 */
const Tips=(()=>{
 let k=0;
 const seen=t=>(SV.tp||[]).includes(t),
 tip=(t,m)=>{if(seen(t))return 0;SV.tp=(SV.tp||[]).concat(t);save();toast(m);return 1},
 TP=[
  ['atk',()=>{const h=E.find(o=>o.t=='tc'&&!o.m);return h&&E.some(o=>o.m==1&&o.k=='u'&&o.t!='v'&&Math.hypot(o.x-h.x,o.y-h.y)<320)},'Attaque ! Bouton « Tous », puis touche un ennemi'],
  ['riv',()=>Nav.on&&T>5&&MAPS[L.mp|0].rv,'Une rivière : on ne la traverse que par le pont ou le gué'],
  ['zone',()=>Nav.on&&T>8&&MAPS[L.mp|0].zn,'Eau et lave bloquent ; neige, rochers et vase ralentissent'],
  ['boss',()=>E.some(o=>o.bx!=null&&o.m==1&&!Fog.hid(o)),'Un boss ! Sa zone clignote avant chaque coup : écarte tes troupes'],
  ['pop',()=>pop()>=cap()&&T>30,'Population pleine : bâtis des maisons (ou une grande maison à l’Âge II)'],
  ['age',()=>!era&&T>300&&R[0]>=300&&R[2]>=150,'Tu peux passer à l’Âge II : menu Armée › Âge II (puissance ×2)'],
  ['moine',()=>T>240&&E.some(o=>!o.m&&o.k=='u'&&o.hp<o.mh*.5),'Des blessés ? Le moine (caserne) soigne les troupes proches'],
  ['ob',()=>L.ob,'Regarde le bandeau en haut : cette partie a un objectif spécial']];
 // Une fois par seconde de jeu : au plus un conseil à la fois
 const step=()=>{if(!run||end||T<k)return;k=T+1;for(const[t,f,m]of TP)if(!seen(t)&&f()){tip(t,m);break}},
 start=()=>{k=0;if((SV.g|0)>=50&&tip('forge','Ta gloire se dépense dans la Forge (bouton Amélio. de l’accueil)'))return},
 reset=()=>{k=0};
 return{step,start,reset,tip,TP}})();
</script>
<script>
/* reprise.js — sauvegarde de la partie en cours (campagne) : toutes les 20 s de jeu et quand l'appli passe en arrière-plan ; bouton REPRENDRE à l'accueil (home.js)
 * Rep.on : partie de campagne en cours (posé par beginLevel, retiré par fin, Quitter) · Rep.has() : une partie à reprendre · Rep.resume() : la relance */
const Rep=(()=>{
 const K=TEST_ON?'cendres_test_run':'cendres_run',X={on:0};let nx=20;
 const ok=()=>X.on&&!end&&E&&!Inf.on&&!Defi.on&&!Boss.es;
 X.save=()=>{if(!ok())return;try{localStorage.setItem(K,JSON.stringify({v:1,LI,LT,E,id,R,ER,T,era,eraE,ai,lost,cam,lf:{cd:L.cd,bd:L.bd,aw:L.aw},te:Tech.sv(),fx:Fog.sv()}))}catch(e){}};
 X.clear=()=>{X.on=0;try{localStorage.removeItem(K)}catch(e){}};
 const get=()=>{try{const j=JSON.parse(localStorage.getItem(K));return j&&j.v==1&&LV[j.LI]?j:null}catch(e){return null}};
 X.has=()=>!!get();
 X.step=()=>{if(T>=nx){nx=T+20;X.save()}};   // engine.js, loop
 X.start=()=>{X.on=1;nx=20};   // ui.js, beginLevel
 X.resume=()=>{const j=get();if(!j)return;
  Px.hide();$('ov').style.display='none';LI=j.LI;LT=j.LT;L=lvl(LI,LT);init();
  E=j.E;id=j.id;R=j.R;ER=j.ER;T=j.T;era=j.era;eraE=j.eraE;ai=j.ai;lost=j.lost;cam.x=j.cam.x;cam.y=j.cam.y;clamp();Object.assign(L,j.lf);
  Tech.ld(j.te);Fog.ld(j.fx);sel=[];X.on=1;nx=T+20;run=1;toast('Partie reprise')};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)X.save()});
 addEventListener('pagehide',X.save);
 return X})();
</script>
<script>
/* succes.js — SUCCÈS (trophées) et statistiques : compteurs de la partie (Ach.g), compteurs de toujours (SV.ac.s), 16 succès à +50 gloire chacun, écran Accueil › trophée.

const Ach=(()=>{

 GL=50,X={g:{k:0,l:0,tr:0,rc:0}},
 sv=()=>{const a=SV.ac||(SV.ac={});a.s=Object.assign({w:0,k:0,bk:0,tr:0,rc:0,dw:0,a3:0},a.s);a.ok=a.ok||[];return a},

 X.n=()=>sv().ok.length;

   ctext(Dd,a.ok.length+'/'+D.length+'  +'+GL+' GLOIRE',57.5,6,1,C.dim);

<script>
/* quotidien.js — cadeau du jour : de la gloire offerte une fois par jour, de plus en plus sur 7 jours d’affilée (série), doublée par une pub récompensée.
 * La fiche « CADEAU » s’ouvre d’elle-même à l’accueil (home.js : Daily.auto) quand un cadeau est disponible, une fois par lancement du jeu.
 *   Jamais avant la première partie terminée (SV.pg) : le nouveau joueur va droit au jeu.
 * Série : jour 1 à 7 (GL) ; un jour sauté → retour au jour 1 ; après le jour 7 → jour 1.
 * Sauvegarde : SV.dq = { j : date locale du dernier cadeau pris (AAAA-MM-JJ), n : jour de série de ce cadeau (1 à 7) }.
 * Script classique (pas de module ES). Ordre de chargement : après screens.js et ads.js, avant ui.js.
 * Dépend de : engine.js (SV, save) · pix.js (Px) · screens.js (screens.kit) · ads.js (Ads) · home.js (home) · ui.js (toast, à l’exécution).
 */
const Daily=(()=>{
 const GL=[30,40,50,60,80,100,200];   // gloire des jours 1 à 7
 const{text,ctext,cico,RC,tw,wrap}=Px;
 let seen='';   // date du jour pour laquelle la fiche s’est déjà ouverte d’elle-même (une fois par lancement)
 const pad=n=>(n<10?'0':'')+n,key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
 today=()=>key(new Date()),
 yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return key(d)},
 q=()=>SV.dq||{j:'',n:0},
 ready=()=>(SV.pg|0)>=1&&q().j!=today(),
 day=()=>{const s=q();return s.j==yesterday()?s.n%7+1:1};   // jour de série du cadeau disponible (1 à 7)
 // Prend le cadeau (x = 1 ou 2), puis retour à l’accueil avec un message
 const take=(x,m)=>{if(!ready())return home(m);const k=day(),gv=GL[k-1]*x;SV.g+=gv;SV.dq={j:today(),n:k};save();
  home(I18.t('Cadeau du jour : +# gloire').replace('#',gv))};
 const screen=m=>{const{open,card,hb,C,CW}=screens.kit;seen=today();
  open({title:'CADEAU',gl:1,back:()=>home(m),build(mc,vh){
   const k=ready()?day():0,L=wrap('SÉRIE DE 7 JOURS',111),t0=17+L.length*9,cw=27,ch=31,gp=2.3,by=t0+2*ch+4+10,H=Math.max(vh,by+48),D=screens.kit.deco(mc,H);
   ctext(D,k?'JOUR '+k+' / 7':'REVIENS DEMAIN',CW/2,4,1,C.acc);
   L.forEach((l,j)=>ctext(D,l,CW/2,15+j*9,1,C.dim));
   GL.forEach((v,i)=>{const r=i<4?0:1,c=r?i-4:i,x=Math.round(r?(CW-3*cw-2*gp)/2+c*(cw+gp):c*(cw+gp)),y=t0+r*(ch+4),d=i+1,
    past=k?d<k:d<=q().n&&q().j==today(),now=d==k;
    card(D,x,y,cw,ch,now);
    ctext(D,'J'+d,x+cw/2,y+3,1,now?C.acc:C.dim);
    cico(D,'crown',x+cw/2,y+15,1,past?C.line:'#d29a1e');
    const s=String(v);text(D,s,x+Math.round((cw-tw(s,1))/2),y+21,1,past?C.line:C.ink);
    if(past)RC(D,x+1,y+1,cw-2,ch-2,'#e9d9ae',.45)});
   if(k){const v=GL[k-1];
    hb(mc,0,by,CW,18,()=>({t:'PRENDRE +'+v,k:'pri',i:'crown'}),'take','Prendre '+v+' gloire').onclick=()=>take(1,m);
    if(Ads.ready())hb(mc,0,by+24,CW,18,()=>({t:'PUB : DOUBLE +'+2*v,k:'gold'}),'ad2','Regarder une pub pour gagner '+2*v+' gloire').onclick=()=>Ads.rewarded(ok=>{if(ok)take(2,m)})}
   return H}})};
 return{
  GL,ready,day,screen,
  // À l’accueil : ouvre la fiche si un cadeau est disponible et qu’elle ne s’est pas encore ouverte aujourd’hui ; vrai si ouverte
  auto(m){if(!ready()||seen==today())return false;screen(m);return true}}})();

<script>
/* coffre.js — coffres d’étoiles : un coffre toutes les 10 étoiles gagnées (toutes les étoiles de tous les paliers comptent, 450 au plus → 45 coffres).
 * Contenu tiré au hasard à l’ouverture : de la gloire (50 à 150, parfois un gros lot de 300) ou, plus rarement, le skin le moins cher pas encore possédé.
 * Toujours gratuit : aucun coffre ne s’achète.
 * Entrées : bouton coffre sur la carte de campagne (campaign.js), message après une partie quand un coffre est prêt (screens.js, result).
 * Sauvegarde : SV.ch = nombre de coffres déjà ouverts.
 * Script classique (pas de module ES). Ordre de chargement : après screens.js et skins.js, avant ui.js.
 * Dépend de : engine.js (SV, save) · levels.js (LV, tierStars) · skins.js (SKINS, skinOwn, skinUnlock) · pix.js (Px) · screens.js (screens.kit) · audio.js (Snd) · campaign.js (campaign).

const Chest=(()=>{

 const draw=(S,cx,by,c,op)=>{const x=Math.round(cx-8*c),y=by-13*c,R=(a,b,w,h,col,al)=>RC(S,x+a*c,y+b*c,w*c,h*c,col,al);

  else{R(1,1,14,1,'#241c0c');R(0,2,16,4,'#241c0c');R(1,2,14,3,'#a8692e');R(1,2,14,1,'#c98a45');R(3,1,2,5,'#d29a1e');R(11,1,2,5,'#d29a1e')}
  R(0,6,16,7,'#241c0c');R(1,6,14,6,'#8a5a2b');R(1,6,14,1,'#a8692e');R(3,6,2,6,'#d29a1e');R(11,6,2,6,'#d29a1e');

  open({title:'COFFRES',gl:1,back:()=>bk?bk():campaign(),build(mc,vh,o){

   if(got){cico(D,'crown',CW/2,40,3,'#f2c230','#241c0c');ctext(D,got,CW/2,98,1,C.acc)}   // récompense : grande couronne au-dessus du coffre ouvert
   if(k)hb(mc,0,112,CW,18,()=>({t:got?'OUVRIR LE SUIVANT':'OUVRIR',k:'pri'}),'op','Ouvrir un coffre').onclick=()=>{got=roll();o.again()};

<script>
/* ui.js — interface : boutons, pointeur, messages, objectifs, écran de consentement, pause et démarrage du jeu.
 * L’accueil est dans home.js, la carte de campagne dans campaign.js, Skins / Réglages / Forge / Aide dans screens.js (écrans en pixel art, pix.js).
 * Ordre de chargement : engine.js … hud.js, pix.js, fog.js, home.js, campaign.js, screens.js, ui.js (voir index.html).
 * Utilise, à l’exécution, des éléments définis dans :
 *   engine.js : $, BS, CK, E, L, LI, LT, MX, R, SP, SV, blt, c, cam, cap, clamp, end, era, init, loop, mil, mkfarm, mvTo, near, place, pop, run, save, sel, train · levels.js : lvl
 *   renderer.js : FX, rz · pix.js : Px · fog.js : Fog · home.js : home · screens.js : settingsScreen · terrain.js : Terrain (tap : wet)
 */

let ds=null;
function tap(px,py){
 const x=px+cam.x,y=py+cam.y;
 if(place){if(!Fog.exp(x,y)){toast('Zone inconnue : explore d’abord');return}const w=Terrain.wet(x,y,place=='f'?18:B[place].z/2);if(w){toast(w==2?'Impossible de construire sur ce terrain':'Impossible de construire dans l’eau');return}const k=CK[place];if(R.every((v,i)=>v>=k[i])){R=R.map((v,i)=>v-k[i]);place=='f'?mkfarm(x,y,1):blt(place,0,x,y)}place=0;return}
 const h=pick(x,y);
 if(h&&h.k=='u'&&!h.m)sel=[h];
 else{cmdfx(h,x,y);const grp=[];sel.forEach(u=>{
  if(h&&h.k=='r'&&u.t=='v'){if(u.cg>0&&u.rt!=h.t)u.st='d';else{u.rt=h.t;u.st='g'}u.tg=h.id}
  else if(h&&h.t=='tc'&&!h.m&&u.t=='v'&&u.cg>0)u.st='d'
  else if(h&&h.m==1&&mil(u)){u.st='a';u.tg=h.id}
  else grp.push(u)
 });form(grp,x,y)}
}
// Formation : n unités vers (x, y) → lignes de front perpendiculaires à la marche, 24 px d’écart ; corps à corps devant, archers, catapultes, moines et villageois derrière
function form(g,x,y){
 if(g.length<2){if(g[0])mvTo(g[0],x,y);return}

<script>
/* guide.js — flèche de guidage du tutoriel (niveau 1, palier Amateur) : une flèche pixel dorée rebondit au-dessus de ce qu’il faut toucher.
 * Objectif 1 (baies) : un villageois libre, puis, une fois un villageois choisi, les baies les plus proches.
 * Objectif 2 (bois) : un villageois, puis l’arbre le plus proche. Ensuite, plus de flèche (le joueur a compris le geste).
 * Tourne sur son propre minuteur (10 fois par seconde), hors de la boucle de jeu : rien de coûteux par image.
 * Script classique (pas de module ES). Ordre de chargement : après ui.js (OI, objectifs) et pix.js.
 * Dépend de (à l’exécution) : engine.js ($, E, c, cam, sel, run, end, LI, LT) · ui.js (OI) · pix.js (Px) · fog.js (Fog.exp).
 */
const Guide=(()=>{
 const A=['..ooo..','..oyo..','..oyo..','oyyyyyo','.oyyyo.','..oyo..','...o...'],K={o:'#241c0c',y:'#ffd25a'};
 let el=null;
 const make=()=>{const S=Px.surf(7,7,8);A.forEach((r,j)=>[...r].forEach((ch,i)=>{if(K[ch])Px.RC(S,i,j,1,1,K[ch])}));
  el=document.createElement('div');el.id='gd';el.setAttribute('aria-hidden','true');el.appendChild(S.cv);document.body.appendChild(el)};
 const near=(fn,from)=>{let b=null,bd=1e9;for(const o of E)if(fn(o)){const d=Math.hypot(o.x-from.x,o.y-from.y);if(d<bd){bd=d;b=o}}return b};
 // Cible du moment, ou null
 const target=()=>{
  if(LI||LT||!run||end||Px.on||OI>1)return null;
  const tc=E.find(o=>o.t=='tc'&&!o.m);if(!tc)return null;
  const vs=sel.find(o=>o.t=='v'&&!o.m);
  if(!vs)return near(o=>o.t=='v'&&!o.m&&(OI==0?!o.st:o.rt!=1),tc)||near(o=>o.t=='v'&&!o.m,tc);
  return near(o=>o.k=='r'&&o.t==OI&&!o.fm&&o.n>0&&Fog.exp(o.x,o.y),vs)};
 const tick=()=>{const t=target();if(!t){if(el)el.style.display='none';return}
  if(!el)make();const r=c.getBoundingClientRect(),x=r.left+t.x-cam.x,y=r.top+t.y-cam.y-(t.k=='r'?16:22);
  if(x<r.left||x>r.right||y<r.top||y>r.bottom){el.style.display='none';return}
  el.style.display='block';el.style.transform='translate('+Math.round(x-14)+'px,'+Math.round(y-28)+'px)'};
 setInterval(tick,100);
 return{target}})();
</script>
<script>
/* retour.js — bouton « retour » d’Android (et geste retour du navigateur) : une seule règle pour tout le jeu (Back.act).
 * Ordre : fenêtre de pub ou d’achat simulée → Échap (annule si c’est permis) · fenêtre #ov (consentement…) → son bouton Retour, sinon rien ·
 *   écran pixel art (#px) → bouton ← de l’écran (fiche de niveau ouverte : la ferme) ; accueil : rien → l’app se ferme ·
 *   en partie : pose de bâtiment annulée, sinon panneau du bas fermé, sinon pause (Réglages).
 * App native (Capacitor) : écoute « backButton » du plugin App ; quand Back.act() ne fait rien (accueil), l’app passe en arrière-plan.
 * Navigateur : une entrée d’historique sert de piège : un retour la consomme, le jeu agit puis la remet ; à l’accueil, le retour quitte la page.
 * Script classique (pas de module ES). Ordre de chargement : dernier (après ui.js).
 * Dépend de (à l’exécution) : engine.js ($, run, end, place) · hud.js (PN, panel) · ui.js (pauseMenu) · pix.js (Px).
 */
const Back=(()=>{
 const vis=e=>e&&e.offsetParent!==null;
 // Fait l’action « retour » de l’écran affiché ; vrai si quelque chose a été fait (ou bloqué), faux à l’accueil (on peut quitter)
 const act=()=>{
  const dlg=[...document.querySelectorAll('body > [role=dialog]')].pop();
  if(dlg){dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));return true}   // pub récompensée ou achat simulé : Échap = annuler (la pub entre les parties ne s’annule pas)
  const ov=$('ov');
  if(ov&&ov.style.display=='flex'){const r=ov.querySelector('[data-r]');if(r)r.click();return true}   // consentement : obligatoire au premier lancement
  if(Px.on){const b=[...document.querySelectorAll('#px [data-h=back]')].find(vis);if(b){b.click();return true}return false}
  if(run&&!end){if(place){place=0;return true}if(PN){panel(PN);return true}pauseMenu();return true}
  return false};
 const cap=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
 if(cap)cap.addListener('backButton',()=>{if(!act())cap.minimizeApp()});
 else{try{history.pushState({vareth:1},'');addEventListener('popstate',()=>{if(act())history.pushState({vareth:1},'');else history.back()})}catch(e){}}
 return{act}})();
</script>
