/* ===== Thème (variables de couleur) ===== */
:root {
  --bg: #2f5d57;
  --fg: #f0e8d0;
  --bt: #d2a13a;
  --bf: #241c0c;
  box-sizing: border-box;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #16302d; --bt: #c8933a; }
}
:root[data-theme="dark"] { --bg: #16302d; --bt: #c8933a; }

/* ===== Base ===== */
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px Bitter, Georgia, serif;
  overscroll-behavior: none;
}
body {
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
canvas { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }

/* ===== Boutons ===== */
button {
  background: var(--bt);
  color: var(--bf);
  border: 0;
  border-radius: 6px;
  padding: 7px 9px;
  font: 600 13px Bitter, Georgia, serif;
  touch-action: manipulation;
}
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* ===== HUD : barre du haut (la barre d'actions est dans hud.css) ===== */
#top {
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-weight: 800;
  font-size: 15px;
}
#top > span { min-width: 0; }
#tb { display: flex; flex: none; gap: 6px; }
#tb button { width: 44px; height: 44px; padding: 0; border-radius: 10px; font-size: 18px; line-height: 1; }
#tb #bx { font: 800 15px Bitter, Georgia, serif; }
@media (max-width: 359px) {
  #top { font-size: 13px; gap: 4px; }
  #tb { gap: 4px; }
  #tb button { width: 38px; height: 38px; font-size: 16px; position: relative; }

<script>
/* i18n.js — langue du jeu (français ou anglais). Chargé en premier (index.html).
 * I18.lang : 'fr' ou 'en' (Réglages › LANGUE ; par défaut : langue du téléphone) · I18.t(s) : texte traduit (s inchangé en français ou si absent)
 * Les textes passent par trois portes : écrans pixel art (pix.js : text, tw, wrap), canvas du jeu (renderer.js : fillText), page (observateur des nœuds texte et des aria-label, ci-dessous).
 * Clé : le texte français, chiffres remplacés par # (remis dans l'ordre dans la traduction) ; une clé qui commence par ~ est une expression régulière ($1… traduits à leur tour). Dictionnaire : en.js. */
const I18=(()=>{
 const X={lang:'fr',D:new Map(),U:new Map(),RX:[],off:0,miss:window.__miss?new Set():null},OUT=new Set();   // U : mêmes clés en majuscules · OUT : textes déjà en anglais (pas de nouvelle recherche)
 try{const v=localStorage.getItem('cendres_lang');X.lang=v=='en'||v=='fr'?v:/^fr/i.test(navigator.language||'fr')?'fr':'en'}catch(e){}
 X.set=v=>{try{localStorage.setItem('cendres_lang',v)}catch(e){}location.reload()};
 X.add=a=>{for(let[k,v]of a)if(k[0]=='~')X.RX.push([new RegExp(k.slice(1)),v]);else{k=k.replace(/\d+(?:[.,]\d+)?/g,'#');X.D.set(k,v);X.U.set(k.toUpperCase().replace(/’/g,"'"),v.toUpperCase());OUT.add(v);OUT.add(v.toUpperCase())}};
 X.ok=L=>{for(const s of L)OUT.add(s.trim())};   // lignes déjà traduites (pix.js, wrap)
 const NUM=/\d+(?:[.,]\d+)?/g,C=new Map();
 const one=s=>{
  const k=s.replace(NUM,'#');let v=X.D.get(k);if(v===undefined){const u=X.U.get(k.toUpperCase().replace(/’/g,"'"));if(u!==undefined)v=s===s.toUpperCase()?u:u[0]+u.slice(1).toLowerCase()}   // même texte en majuscules (ou en minuscules)
  if(v!==undefined){if(v.indexOf('#')<0)return v;const n=s.match(NUM)||[];let i=0;return v.replace(/#/g,()=>n[i++]??'#')}
  for(const[r,w]of X.RX){const m=s.match(r);if(m)return w.replace(/\$(\d)/g,(_,j)=>X.t(m[+j]||''))}
  if(X.miss&&/[a-zà-ÿ]{2}/i.test(s))X.miss.add(k);
  return s};
 X.t=s=>{
  if(X.lang=='fr'||X.off||typeof s!='string'||!s)return s;
  let r=C.get(s);if(r!==undefined)return r;
  const a=s.match(/^\s*/)[0],b=s.match(/\s*$/)[0],m=s.trim();
  if(OUT.has(m))return s;
  r=m?a+one(m)+b:s;if(C.size>4000)C.clear();C.set(s,r);if(r!==s)OUT.add(r.trim());return r};

<script>
/* levels.js — niveaux de la campagne et paliers de difficulté : tout se règle ici.
 * Script classique (pas de module ES) : définit LV (niveaux), TI (paliers), lvl(i, t) (réglages d’une partie) et tierStars, bestStars, setStars (étoiles par palier).
 * À charger AVANT engine.js (voir index.html) ; lit SV (engine.js) seulement à l’exécution.
 * Utilisé par engine.js (L, init, unit, blt, tick, tw, endGame), ai.js (L.vm, L.wv), enemy.js (L.ea), campaign.js (fiche, carte), screens.js (résultat, fiche de pub), ui.js (startLevel).
 * Chaque niveau se joue à 3 paliers : Amateur (x1), Intermédiaire (x2), Difficile (x4) ; la difficulté double à chaque palier, la gloire aussi (k).
 *   Le palier t + 1 s’ouvre en gagnant le palier t ; le niveau suivant s’ouvre à la première victoire (Amateur).
 * Niveau n (indice i = n − 1) : l’adversaire gagne +5 % par niveau, AJOUTÉS : facteur s = 1 + 0,05 × (n − 1) (niveau 10 : x1,45 · niveau 50 : x3,45 · niveau 300 : x15,95), comme les améliorations du joueur (+5 % chacune) :
 *   vie et dégâts de ses unités (h), solidité de ses bâtiments et dégâts de ses tours (b), vitesse de ses unités (sp, plafonnée à x1,5). La gloire gagnée suit aussi (gl).
 *   Le palier fixe le reste : ressources de départ (r), revenus (e), villageois (vm), taille des vagues (wv), évolutions d’âge (ea), temps cible (tt) ; h est aussi multiplié par le facteur du palier (TI).
 * Sauvegarde : SV.d[i] = nombre de paliers gagnés (0 à 3) · SV.st[i] = étoiles des 3 paliers, 2 bits chacun (palier t : bits 2t et 2t + 1).
 */

// ob : objectif spécial — {k:'tenir',t} : tenir t secondes de jeu = victoire · {k:'eclair',t} : raser le Forum ennemi avant t secondes, sinon défaite · wa : ajout à la taille des vagues (négatif = vagues plus fréquentes)
// cp : champion du niveau (numéro dans MON), il sort du Forum ennemi à 6 min
// pb : bonus du joueur à partir du niveau 21 (+3 % par niveau ; robot bot.js : à +5 %, les chapitres IV et V se gagnaient en 4 min, vie et dégâts de ses unités, vie de ses bâtiments) : ses améliorations plafonnent à x2 (MX), l’ennemi monte jusqu’à x3,45 au niveau 50
// bs : seconde de jeu où le boss bx (numéro dans MON, monstres.js ; 0 = Gorak) sort du Forum ennemi et marche sur le joueur (0 = jamais)
// n : nom · mp : carte (indice dans MAPS, maps.js ; 0 par défaut) · ad : adversaire (indice dans ADV, adv.js ; 0 = Korvan par défaut)
const LV=[{n:'Le Val'},{n:'Le Gué',mp:1,ad:1},{n:'Bocage du Val',mp:2,ad:2},{n:'Collines fleuries',mp:3,ad:3,cp:1},{n:'Rives du Val',mp:4,ad:4,cp:1},{n:'Lac du Val',mp:5,ad:5},{n:'Pâtures',mp:6,ad:6,ob:{k:'tenir',t:480},wa:-2,cp:2},{n:'Rochers du Val',mp:7,ad:7,cp:2},{n:'Marais de brume',mp:8,ad:8},{n:'Fort de Korvan',mp:9,ad:0,bs:480},{n:'Bois de Vareth',mp:10,ad:9},{n:'Ruisseau des fougères',mp:11,ad:10},{n:'Étang noir',mp:12,ad:11,ob:{k:'tenir',t:540},wa:-2},{n:'Rochers moussus',mp:13,ad:12,cp:4},{n:'Tourbière',mp:14,ad:13,ob:{k:'eclair',t:900},cp:4},{n:'Deux eaux',mp:15,ad:14},{n:'Gorge sombre',mp:16,ad:15,ob:{k:'tenir',t:540},wa:-2,cp:5},{n:'Lacs jumeaux',mp:17,ad:16,cp:5},{n:'Marais des ombres',mp:18,ad:17},{n:'Cœur de la Forêt',mp:19,ad:18,bs:480,bx:3},{n:'Plaine dorée',mp:20,ad:19},{n:'Grand fleuve',mp:21,ad:20},{n:'Lac des blés',mp:22,ad:21,ob:{k:'tenir',t:600},wa:-2},{n:'Pierres levées',mp:23,ad:22,cp:7},{n:'Prés humides',mp:24,ad:23,ob:{k:'eclair',t:900},cp:7},{n:'Confluent',mp:25,ad:24},{n:'Défilé des moulins',mp:26,ad:25,ob:{k:'tenir',t:600},wa:-2,cp:8},{n:'Étangs jumeaux',mp:27,ad:26,cp:8},{n:'Marais du baron',mp:28,ad:27},{n:'Château de Vaucel',mp:29,ad:28,bs:480,bx:6},{n:'Col gelé',mp:30,ad:29},{n:'Torrent blanc',mp:31,ad:30},{n:'Lac de glace',mp:32,ad:31,ob:{k:'tenir',t:600},wa:-2},{n:'Éboulis',mp:33,ad:32,cp:10},{n:'Champs de neige',mp:34,ad:33,ob:{k:'eclair',t:900},cp:10},{n:'Gorge du torrent',mp:35,ad:34},{n:'Passe des neiges',mp:36,ad:35,ob:{k:'tenir',t:660},wa:-2,cp:11},{n:'Lacs d’altitude',mp:37,ad:36,cp:11},{n:'Glacier',mp:38,ad:37},{n:'Cime de Granit',mp:39,ad:38,bs:480,bx:9},{n:'Terres brûlées',mp:40,ad:39},{n:'Fleuve de lave',mp:41,ad:40},{n:'Cratère',mp:42,ad:41,ob:{k:'tenir',t:660},wa:-2},{n:'Rocs noirs',mp:43,ad:42,cp:13},{n:'Champs d’obsidienne',mp:44,ad:43,ob:{k:'eclair',t:900},cp:13},{n:'Deux coulées',mp:45,ad:44},{n:'Faille ardente',mp:46,ad:45,ob:{k:'tenir',t:660},wa:-2,cp:14},{n:'Lacs de feu',mp:47,ad:46,cp:14},{n:'Désolation',mp:48,ad:47},{n:'Trône des Cendres',mp:49,ad:48,bs:480,bx:12}],
// Paliers. k : multiplicateur affiché (x1, x2, x4) et facteur de gloire · h : vie et dégâts des unités ennemies · r : ressources de départ · e : revenus de l’ennemi
// vm : villageois ennemis au plus · wv : soldats au repos avant une vague d’attaque · ea : secondes de jeu où l’ennemi passe à l’Âge II puis III (0 = jamais ; enemy.js) · tt : temps cible de la 3e étoile (secondes)
// c, hi, lo : couleurs du palier (bouton, reflet, ombre)
TI=[
 {n:'Amateur',      k:1,h:1,   r:1,  e:1,   vm:14,wv:5,ea:[0,0],    tt:600,c:'#3e8f3a',hi:'#5db554',lo:'#2a6428'},
 {n:'Intermédiaire',k:2,h:1.25,r:1.5,e:1.25,vm:18,wv:6,ea:[480,0],  tt:720,c:'#c98a12',hi:'#f2c230',lo:'#8f600a'},
 {n:'Difficile',    k:4,h:1.5, r:2,  e:1.5, vm:22,wv:8,ea:[360,720],tt:900,c:'#a8281b',hi:'#d6402b',lo:'#701a10'}],
// Réglages de la partie : niveau i, palier t. s = facteur de niveau ; b = solidité des bâtiments et tours ennemis ; sp = vitesse des unités ennemies (plafond x1,5).
lvl=(i,t)=>{
 const B=LV[i],T=TI[t],s=1+.05*i;
 return{n:B.n,mp:B.mp|0,ad:B.ad|0,t,h:T.h*s,e:T.e,b:s,sp:Math.min(s,1.5),r:T.r,vm:T.vm,wv:T.wv+(B.wa|0),ob:B.ob||0,cp:B.cp|0,ea:T.ea.slice(),gl:10*Math.round(10*T.k*s),tt:T.tt,bs:B.bs|0,bx:B.bx|0,pb:.03*Math.max(0,i-19)}
},
// Étoiles (0 à 3) du palier t du niveau i · meilleur résultat tous paliers · enregistre s si c’est mieux
tierStars=(i,t)=>((SV.st[i]|0)>>2*t)&3,
bestStars=i=>Math.max(tierStars(i,0),tierStars(i,1),tierStars(i,2)),
setStars=(i,t,s)=>{if(s>tierStars(i,t))SV.st[i]=(SV.st[i]|0)&~(3<<2*t)|s<<2*t};
</script>
<script>
/* engine.js — boucle de jeu et logique : état, entités, déplacements, récolte, combat, entraînement, tours, campagne et progression.
 * Script classique (pas de module ES) : les déclarations de premier niveau sont partagées entre les fichiers.
 * Ordre de chargement : engine.js, ai.js, renderer.js, ui.js.
 * Utilise, à l’exécution, des éléments définis dans :
 *   renderer.js : FX, draw
 *   ui.js : OI, btns, objs, toast, why · eco.js : Eco (init → reset · loop → sync · tick → inc)
 *   campaign.js : campaign (carte de campagne, affichée en fin de partie) · pix.js : Px
 *   ai.js : ER, ai, aiStep · fog.js : Fog (init → reset, loop → step) · army.js : Arm (unit → mk, tick → acq / fire, loop → step, init → reset)
 *   ages.js : Ages (unit, blt → fit · tick → hit · tw → f, tc) ; era, eraE = âge du joueur, âge de l’ennemi (0 : Âge I, 1 : Âge II, 2 : Âge III)
 *   enemy.js : Enemy (init → reset · loop → sync) ; l’ennemi évolue selon le calendrier L.ea de la partie (lvl, levels.js)
 *   maps.js : MAPS (init : carte du niveau, L.mp) · terrain.js : Terrain (init → make, tree) ; le sol et les arbres dépendent de la carte
 *   nav.js : Nav (init → make · unit, res → fix · mvTo → go · mv → mv · tick, train → sees · loop → step) ; eau, lave, neige et montagne : obstacles et vitesses du terrain
 *   levels.js (chargé avant engine.js) : LV, TI, lvl (L : réglages de la partie = niveau LI au palier LT : h, r, e, b, sp, vm, wv, ea, gl, tt), setStars
 *   boss.js : Boss (tick : stn · mêlée : hit · init : reset · loop : step, hud, won, lost) · essai.js : Essai (endGame : end ; salle d’essai, mode test)
 */

const $=i=>document.getElementById(i),
c=$('c'),
W=1600,
B={tc:{e:'🏰',h:600,z:56},h:{e:'🏠',h:150,z:30},g:{e:'🏢',h:300,z:30},b:{e:'🏯',h:300,z:44},w:{e:'',h:250,z:26},c:{e:'',h:700,z:56}},
rnd=(a,b)=>a+Math.random()*(b-a),
dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let E,
id,
sel,
cam,
R,
T,
end,
era,
eraE,
place,
run=0,
last=0,
lost=0;
const get=i=>E.find(o=>o.id==i),
near=(a,d,f)=>{let b;for(const o of E)if(o!=a&&f(o)){const q=dist(a,o);if(q<d){d=q;b=o}}return b},
add=o=>(o.id=++id,E.push(o),o),
SZ=[300,600,1000],
rsz=()=>{const r=Math.random();return r<.5?0:r<.85?1:2},
res=(t,x,y,z=rsz())=>Nav.fix(add({k:'r',t,x,y,z,n:SZ[z],mx:SZ[z]})),
blt=(t,m,x,y,d)=>Ages.fit(add({k:'b',t,m,x,y,hp:B[t].h*BS*(m?L.b:1+.05*SV.u[1]+L.pb),mh:B[t].h*BS*(m?L.b:1+.05*SV.u[1]+L.pb),sz:B[t].z,bt:d?0:t=='h'?5:t=='c'?15:t=='g'?10:8})),
unit=(t,m,x,y,kn)=>{const s=t=='s',q=(m?L.h:1+.05*SV.u[0]+L.pb)*BS,h=s?(60+(m?T/12|0:0))*q*(kn?4:1):25*BS,u=Ages.fit(add({k:'u',t,m,x,y,hp:h,mh:h,sp:(s?62:52)*MS*(kn?1.3:1),at:s?8*q*(kn?3:1):1,r:s?20:14,st:0,cd:0,cg:0,gt:0,rt:0,tg:0,tx:x,ty:y,am:0,kn,...(t=='a'||t=='m'?Arm.mk(t,m,q):0)}));if(t=='e'){u.hp=u.mh=30*q*Ages.f(u);u.at=3*q*Ages.f(u);u.sp*=1.8}   // éclaireur (e) : rapide, voit loin (fog.js), fragile
 if(t=='p'||t=='x'){const f=Ages.f(u);if(t=='p'){u.hp=u.mh=40*q*f;u.at=0}else{u.hp=u.mh=180*q*f;u.at=60*q*f;u.sp*=.5;u.r=24;u.sz=30}}if(m)u.sp*=L.sp;return Nav.fix(u)},   // moine (p) : soigne · bélier (x) : contre les bâtiments
pop=()=>E.filter(o=>o.k=='u'&&!o.m).length,
mil=o=>o.k=='u'&&o.t!='v',   // unité de combat (guerrier 's', archer 'a', catapulte 'm')
cap=()=>{let n=10;for(const o of E)if(!o.m&&!o.bt)n+=o.t=='h'?5:o.t=='g'?15:0;return n},
ring=(bx,by,t,n,a,b,s)=>{for(let i=0;i<n;i++){const an=rnd(0,6.28),d=rnd(a,b);res(t,bx+Math.cos(an)*d,by+Math.sin(an)*d,s)}},
mvTo=(u,x,y,am)=>{u.st='m';u.tx=x;u.ty=y;u.am=am||0;u.tg=0;Nav.go(u)},
clamp=()=>{cam.x=Math.max(0,Math.min(W-c.clientWidth,cam.x));cam.y=Math.max(0,Math.min(W-c.clientHeight,cam.y))};
function init(){
 E=[];FX=[];OI=0;id=0;sel=[];R=[200,150,0];if(Ads.bonus){R=R.map(v=>v+Ads.bonus);Ads.bonus=0;setTimeout(()=>toast(I18.t('Bonus : +# de chaque ressource').replace('#',Ads.BONUS)),600)}ER=[200*L.r|0,150*L.r|0,0];T=0;end=0;era=0;eraE=0;Tech.reset();Eco.reset();Ach.reset();place=0;ai=0;lost=0;
 const M=MAPS[L.mp|0],[px,py]=M.p,[ex,ey]=M.e,rg=M.rg||[5,3,12];   // carte du niveau (maps.js) : Forums, ressources autour, arbres
 Terrain.make(M);Nav.make(M);
 blt('tc',0,px,py,1);blt('tc',1,ex,ey,1);
 for(let i=0;i<3;i++)unit('v',0,px-40+i*40,py+70);
 for(let i=0;i<3;i++)unit('v',1,ex-40+i*40,ey+70);
 for(const[bx,by]of[M.p,M.e]){ring(bx,by,0,rg[0],110,150);ring(bx,by,2,rg[1],140,180);ring(bx,by,1,rg[2],150,260)}
 for(const[t,n,x,y,a,b]of M.ex||[])ring(x,y,t,n,a,b);
 for(let i=0;i<M.tr;i++){const a=rnd(30,1570),b=rnd(30,1570);if(Math.min(Math.hypot(a-px,b-py),Math.hypot(a-ex,b-ey))>180&&Terrain.tree(a,b))res(1,a,b)}

/* ads.js — pubs : une seule porte d’entrée pour le reste du jeu (Ads.ready, Ads.rewarded, Ads.due, Ads.between).
 * Pour l’instant : pubs SIMULÉES (prototype web). Dans l’app native (Android / iPhone), seuls ready(), rewarded() et between() changent
 * (plugin AdMob : pub récompensée, pub plein écran) : les écrans et le reste du jeu ne bougent pas.
 * Règles : aucune pub n’est demandée tant que cmpOk() (consent.js) est faux. La pub récompensée est toujours lancée par un bouton du joueur.
 *   La pub entre les parties passe une partie sur n (Ads.n = 3) : jamais avant la n-ième partie terminée (donc jamais au premier lancement), jamais juste après une pub vue (récompensée ou non).
 * Compteurs sauvegardés (engine.js) : SV.pg = parties terminées · SV.pa = valeur de SV.pg à la dernière pub vue.
 * Script classique (pas de module ES) : les déclarations de premier niveau sont partagées entre les fichiers.
 * Ordre de chargement : engine.js, ai.js, skins.js, consent.js, settings.js, ads.js, renderer.js, audio.js, ui.js.
 * Dépend de : consent.js (cmpOk, cmpPerso) · engine.js (SV, save).
 * Utilisé par : screens.js (Résultat : pub récompensée ; fiche de pub entre les parties) · ui.js (startLevel).
 */
const Ads=(()=>{
 let busy=0;
 const A={
  ms:3000,   // durée de la pub simulée en millisecondes (les tests la réduisent)
  cd:3000,   // compte à rebours de la fiche du niveau avant la pub entre les parties, en millisecondes (screens.js ; les tests le réduisent)
  n:3,       // une pub entre les parties toutes les n parties terminées
  BONUS:150, // pub récompensée « Rejouer + bonus » (écran de défaite) : ressources ajoutées à chacune des 3 au départ
  bonus:0,   // bonus en attente : ajouté par init() (engine.js) à la partie suivante, puis remis à 0
  // Vrai si une pub récompensée peut être proposée : choix de consentement fait (dans l’app native : et une pub chargée)
  ready:()=>cmpOk(),
  // Lance une pub récompensée. cb(true) : regardée jusqu’au bout (récompense due) ; cb(false) : abandonnée, pub déjà en cours ou pas de consentement
  rewarded(cb){if(busy||!A.ready()){cb(false);return}busy=1;sim(ok=>{busy=0;if(ok){SV.pa=SV.pg;save()}cb(ok)})},

  key=e=>{if(e.key=='Escape'&&!mid)end(false)},

  if(no)no.onclick=()=>end(false);addEventListener('keydown',key);
  document.body.appendChild(o);if(no)no.focus();iv=setInterval(tick,100);tick()}

 *   Prix affiché : celui renvoyé par le store (obligatoire pour Apple et Google) ; ici une valeur de démonstration.
 *   Apple exige un bouton « Restaurer les achats » (Réglages) pour les articles non consommables.
 * Sauvegarde : SV.np = 1 quand « Sans pubs » est acheté (engine.js, save).

const Shop=(()=>{

  restore(cb){toast(S.own()?'Achats restaurés : Sans pubs':'Aucun achat à restaurer');cb&&cb(S.own())}};

  o.innerHTML='<b style="font-size:19px">Sans pubs</b><div>Plus aucune pub entre les parties.<br>Les pubs facultatives (gloire x2, bonus) restent au choix.</div>'
   +'<div style="opacity:.7">Achat simulé : rien n’est payé.</div>'
   +'<div style="display:flex;gap:10px"><button type="button" data-k="non" style="'+bt+';color:#f6efd8;background:#5a4020">Annuler</button>'
   +'<button type="button" data-k="oui" style="'+bt+';color:#241c0c;background:#d2a13a">Acheter '+S.price+'</button></div>';
  o.onclick=e=>{const b=e.target.closest('button');if(b)close(b.dataset.k=='oui')};
  addEventListener('keydown',esc);document.body.appendChild(o)}

<script>
/* anim.js — petites animations : débris et fumée quand un bâtiment s’effondre, poussière quand une unité tombe, fumée qui monte d’un bâtiment très abîmé.

<script>
/* audio.js — sons synthétisés avec l'API Web Audio native (aucun fichier audio).
 * Script classique : définit l'objet global `Snd`. À charger après renderer.js et avant ui.js.
 * Utilise, à l'exécution, de engine.js : cam, c (les sons hors écran sont ignorés).
 * API : Snd.play(nom, vol=1) · Snd.at(nom, x, y) · Snd.toggle() · Snd.on
 * Noms : 'clic', 'epee', 'recolte', 'fin', 'arc' (tir d’archer), 'catapulte' (lancer), 'impact' (boulet qui tombe),
 *   Âge II : 'fusil' (coup de feu), 'obus' (tir de char) · Âge III : 'laser' (tir de robot), 'plasma' (canon plasma) · 'age' (fanfare de passage d’âge) ·
 *   'cor' (cor d’alerte : l’ennemi passe à l’âge suivant, voir enemy.js) */
const Snd=(()=>{

  if(!ctx){
   const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
   try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}   // iOS : le mode silencieux ne coupe plus le son

  clic:(t,v)=>tone('square',680,980,t,.05,.12*v),
  epee:(t,v)=>{burst('highpass',2200,t,.09,.35*v);tone('triangle',1500,950,t,.14,.12*v);tone('sine',2400,1900,t+.012,.1,.07*v)},
  recolte:(t,v)=>{tone('triangle',260,120,t,.09,.22*v);burst('bandpass',900,t,.04,.12*v)},
  fin:(t,v)=>[523.25,659.25,783.99].forEach((f,i)=>tone('triangle',f,f,t+i*.09,.18,.2*v)),
  arc:(t,v)=>{burst('bandpass',2400,t,.07,.22*v);tone('triangle',620,260,t,.09,.1*v)},
  catapulte:(t,v)=>{tone('sawtooth',170,70,t,.16,.1*v);tone('sine',120,45,t+.02,.28,.32*v);burst('lowpass',500,t,.22,.3*v)},
  impact:(t,v)=>{tone('sine',95,35,t,.34,.42*v);burst('lowpass',700,t,.3,.5*v);burst('bandpass',1800,t,.08,.15*v)},
  fusil:(t,v)=>{burst('highpass',1500,t,.05,.38*v);tone('square',340,80,t,.07,.1*v);burst('lowpass',1000,t+.012,.11,.22*v)},
  obus:(t,v)=>{tone('sine',150,45,t,.22,.36*v);burst('lowpass',900,t,.2,.38*v);burst('bandpass',2200,t,.05,.16*v)},
  laser:(t,v)=>{tone('sawtooth',1500,260,t,.13,.09*v);tone('sine',2400,500,t,.1,.08*v)},
  plasma:(t,v)=>{tone('sawtooth',260,900,t,.22,.12*v);tone('sine',180,640,t,.26,.2*v);burst('bandpass',1400,t,.12,.1*v)},
  age:(t,v)=>[392,523.25,659.25,784,1046.5].forEach((f,i)=>tone('triangle',f,f,t+i*.1,.26,.22*v)),
  cor:(t,v)=>{tone('sawtooth',110,134,t,.7,.1*v);tone('triangle',220,268,t,.7,.2*v);tone('sawtooth',165,200,t+.42,1,.1*v);tone('triangle',330,400,t+.42,1,.18*v);burst('lowpass',600,t,.3,.1*v)}

 const play=(name,vol=1)=>{

})();
</script>
<script>
/* music.js — musique synthétisée (Web Audio, aucun fichier) : un thème à l'accueil, un thème par chapitre en partie, plus intense quand un boss ou un champion est en jeu.
 * Script classique. À charger après audio.js (voir index.html). Utilise Snd (ctx, bus : même contexte et même compresseur que les sons) ; lit run, end, LI, E (engine.js).
 * Planification : toutes les 120 ms, les notes des 0,4 s suivantes sont posées sur l'horloge audio (pas de logique de jeu ici). Page cachée : rien n'est planifié, le son se coupe.
 * Mémoire : cendres_mus = '0' (coupée) ou '1' ; absente = active. Interrupteur MUSIQUE des Réglages (screens.js) : Mus.toggle().
 */
const Mus=(()=>{

 try{on=localStorage.getItem('cendres_mus')!=='0'}catch(e){}
 // Thèmes : bpm, racine (Hz), gamme (demi-tons), accords (degrés de la gamme), batterie (0 calme, 1 marche, 2 combat)

  {bpm:84,r:196,sc:[0,2,4,7,9],ch:[0,3,4,2],dr:0},        // accueil : pentatonique douce
  {bpm:100,r:220,sc:[0,2,4,5,7,9,11],ch:[0,5,3,4],dr:1},  // I Le Val : majeur, clair
  {bpm:92,r:196,sc:[0,2,3,5,7,9,10],ch:[0,6,5,4],dr:1},   // II Forêt : dorien, sombre
  {bpm:108,r:233,sc:[0,2,4,5,7,9,10],ch:[0,6,3,4],dr:1},  // III Plaines : mixolydien
  {bpm:96,r:175,sc:[0,2,3,5,7,8,10],ch:[0,5,6,4],dr:1},   // IV Monts : mineur
  {bpm:112,r:165,sc:[0,1,3,5,7,8,10],ch:[0,1,5,6],dr:1}], // V Cendres : phrygien

  e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(v,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d+.02)},
 hit=(c,t,v,hi)=>{const s=c.createBufferSource(),fl=c.createBiquadFilter(),e=c.createGain();s.buffer=nb;fl.type=hi?'highpass':'lowpass';fl.frequency.value=hi?6000:180;

</script>
<script>
/* hud.js — barre d’actions : menus « Bâtir », « Armée » (onglets Troupes | Progrès) et « Progrès », ordres contextuels (Tous, Attaque, Désélect., Annuler).
 * Script classique (pas de module ES) : les déclarations de premier niveau sont partagées entre les fichiers.
 * Ordre de chargement : engine.js, ai.js, skins.js, consent.js, settings.js, renderer.js, audio.js, hud.js, ui.js.
 * Utilise, à l’exécution, des éléments définis dans :
 *   engine.js : $, CK, E, R, c, end, era, mil, place, run, sel, train
 *   ui.js : plc, toast · army.js : Arm (icônes des unités) · ages.js : Ages (nm : noms par âge · ic : icônes des bâtiments · up : passage d’âge) · tech.js : Tech (cartes, achat, pastille rouge)
 * Ajouter un bâtiment ou une unité = ajouter une ligne dans BUILD ou TRAIN (son coût existe déjà dans CK ou dans train(), côté engine.js).
 */
const BUILD=[['h','🏠','Maison'],['g','🏢','Grande maison','Âge II'],['f','🌾','Champ'],['b','🏯','Caserne'],['w','🗼','Tour'],['c','🏰','Château']],   // [clé de CK, icône, nom, mention tant que l’âge requis n’est pas atteint]
TRAIN=[['s','⚔️','Guerrier',[50,20,0],'b','Caserne'],['a','🏹','Archer',[40,30,0],'b','Caserne'],['k','🐎','Chevalier',[100,0,60],'c','Château'],['m','🪨','Catapulte',[0,150,100],'c','Château · Âge II',1],['e','🔭','Éclaireur',[40,0,0],'tc','Forum · voit loin'],['p','💚','Moine',[60,0,30],'b','Caserne · soigne'],['x','🪵','Bélier',[0,120,30],'b','Caserne · abat les murs']],   // [clé de train(), icône de secours (le menu affiche le sprite : Arm.icon), nom, coût (nourriture, bois, or), bâtiment requis, mention affichée, âge minimum]
VIL=[50,0,0],AGE=[[300,0,150],[600,0,400]],   // villageois (Forum) ; coût du passage à l’Âge II puis à l’Âge III (voir ages.js)
afford=k=>R.every((v,i)=>v>=k[i]),
has=t=>E.some(o=>o.t==t&&!o.m&&!o.bt),
cost=k=>k.map((v,i)=>v?v+['🍖','🪵','🪙'][i]:'').filter(x=>x).join(' '),
card=(p,k,ic,n,s,q)=>'<button class="cd" data-p="'+p+'" data-k="'+k+'"><i>'+ic+'</i><b>'+n+'</b><small>'+s+'</small>'+(q?'<small class="rq">'+q+'</small>':'')+'</button>';
// Onglets du menu Armée : Troupes | Progrès (pastille rouge quand une technologie est achetable, voir tech.js)
const tabs=()=>'<div class="tabs">'+[['u','⚔️ Troupes'],['t','📜 Progrès<span class="bdg"'+(Tech.ok()?'':' hidden')+'></span>']].map(([k,s])=>'<button data-p="x" data-k="'+k+'"'+(PN==k?' class="on"':'')+'>'+s+'</button>').join('')+'</div>';
let PN=0,PE=0,PA=0;   // PN : contenu du menu ouvert (0, 'b' = Bâtir, 'u' = Troupes, 't' = Progrès) ; PA : 1 si le menu est ouvert par Armée (onglets Troupes | Progrès) ; PE : âge affiché dans le menu

// Remplit le menu ouvert
function fill(){
 PE=era;
 $('pn').innerHTML=PN=='b'?BUILD.map(([k,ic,n,q])=>card('b',k,Ages.ic(k)||ic,Ages.nm(k,n),cost(CK[k]),era?'':q)).join('')
  :(PA?tabs():'')+(PN=='t'?Tech.cards():TRAIN.map(([k,ic,n,q,b,r])=>card('u',k,Arm.icon(k)||ic,Ages.nm(k,n),cost(q),r)).join('')+(era>1?card('u','age','✅','Âge III','Acquis'):card('u','age','⏫','Âge '+['II','III'][era],cost(AGE[era]),['Armée moderne','Robots'][era])))
}
// Ouvre le menu k ('b' Bâtir · 'u' Armée, avec ses onglets Troupes | Progrès · 't' Progrès seul), le referme s’il est déjà ouvert ; panel(0) le ferme
function panel(k){
 const same=!k||(k=='u'?PA&&PN:k=='t'?PN=='t'&&!PA:PN==k);
 PN=same?0:k;PA=PN=='u'?1:0;$('pn').hidden=!PN;$('pn').scrollTop=0;
 for(const[id,v]of[['bp',PN=='b'],['bn',PA&&PN],['bt',PN=='t'&&!PA]]){$(id).classList.toggle('on',!!v);$(id).setAttribute('aria-expanded',!!v)}
 if(PN)fill()
}
function ageUp(){
 if(era>1)return toast('Âge III déjà atteint');
 const k=AGE[era];
 if(!afford(k))return toast('Il manque des ressources ('+cost(k)+')');
 R=R.map((v,i)=>v-k[i]);Ages.up()
}
// Un toucher sur une carte lance l’action et referme le menu ; si l’action échoue (ressources manquantes), le message s’affiche et le menu reste ouvert
$('pn').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,p=b.dataset.p;
 if(p=='b'){plc(k);if(place)panel(0)}
 else if(p=='x'){PN=k;$('pn').scrollTop=0;fill()}   // onglet Troupes | Progrès
 else if(p=='t'){if(Tech.buy(+k))fill()}   // technologie : le menu reste ouvert
 else if(k=='age'){const e=era;ageUp();if(era>e)panel(0)}
 else{const n=pop();train(k);if(pop()>n)panel(0)}};
c.addEventListener('pointerdown',()=>{if(PN)panel(0)});   // un toucher sur la carte referme le menu (et agit normalement)
$('bv').querySelector('small').textContent=cost(VIL);

// Appelée à chaque image : boutons grisés, ordres contextuels, menu ouvert
function btns(){
 const on=run&&!end;$('up').hidden=!on;
 if(!on){if(PN)panel(0);return}
 Tech.sync();
 const n=E.filter(o=>o.t=='v'&&!o.m&&!o.st).length,i=$('bi'),sm=i.querySelector('small');
 $('bv').style.opacity=afford(VIL)&&has('tc')?1:.45;
 if(sm.textContent!=n)sm.textContent=n;i.style.opacity=n?1:.45;
 $('ba').hidden=!E.some(o=>mil(o)&&!o.m);   // Tous : si on a des unités de combat
 $('bg').hidden=!sel.some(mil);   // Attaque : si des unités de combat sont sélectionnées
 $('bd').hidden=!sel.length;   // Désélect. : si quelque chose est sélectionné
 $('bq').hidden=!place;   // Annuler : pendant la pose d’un bâtiment
 if(PN){
  if(PE!=era)fill();
  for(const b of $('pn').children){const k=b.dataset.k,p=b.dataset.p,t=TRAIN.find(u=>u[0]==k);
   if(p=='t')Tech.mark(b,+k);
   else if(p=='b'||p=='u')b.classList.toggle('no',!(p=='b'?afford(CK[k])&&(era||k!='g'):k=='age'?era<2&&afford(AGE[era]):afford(t[3])&&has(t[4])&&era>=(t[6]|0)))}
 }
}
</script>
<script>
/* eco.js — écran des ressources : 4 puces dans la barre du haut (vivres, bois, or, population ; une jauge sous chaque nombre) et feuille de détail #rp au-dessus de la barre du bas.
 * Script classique (pas de module ES) : les déclarations de premier niveau sont partagées entre les fichiers.
 * Ordre de chargement : engine.js … hud.js, eco.js, pix.js … (voir index.html).
 * Utilise, à l’exécution, des éléments définis dans :
 *   engine.js : $, CK, E, R, SP, T, c, cap, dist, end, era, near, place, pop, run · renderer.js : FX, PRM, BUSH, GOLD, TREE, im, rows
 *   hud.js : AGE, PN, afford, cost, panel · ui.js : plc, toast · settings.js : vib · fog.js : Fog (hid)
 *   ages.js : Ages (nm, spr) · tech.js : Tech (D, nm, st) · pix.js : Px (spU)
 * Utilisé par engine.js (init → reset · loop → sync · tick → inc).
 * Jauge de chaque ressource = stock ÷ prix de la prochaine grosse dépense qui en demande : l’Âge suivant, puis le Château, puis la technologie débloquée la moins chère.
 * Temps restant = (prix − stock) ÷ revenu mesuré : dépôts des villageois sur les 60 dernières secondes de partie (tranches de 5 s, affiché dès 15 s), pour la vitesse de jeu en cours.
 */
const Eco=(()=>{
 const NM=['Vivres','Bois','Or'],LB=['des baies','du bois','de l’or'],
 BL=5,NB=13,   // revenu : tranches de 5 s de partie (12 terminées + 1 en cours)
 rs=$('rs'),rp=$('rp'),
 // n’écrivent dans le DOM que si la valeur change (comme btns, hud.js)
 tx=(e,s)=>{if(e._v!==s){e._v=s;e.textContent=s}},
 wd=(e,p)=>{if(e._p!==p){e._p=p;e.style.width=p+'%'}},
 hd=(e,h)=>{if(e._h!==h){e._h=h;e.hidden=h}},
 dg=v=>v<10?1:v<100?2:v<1e3?3:v<1e4?4:5,
 dur=s=>s<59.5?Math.max(1,Math.round(s))+' s':s<5940?Math.round(s/60)+' min':'+ de 99 min';
 let bk,bi,nb,rt,go,vc,id,pp,cp,cEra,rw,ln,la,op=0,tm,ts=0,ta=0;   // bk, bi, nb, rt : revenu (tranches, tranche en cours, tranches terminées, revenu par minute de partie, null = pas encore mesuré) · go : objectifs · vc : villageois par ressource · id : inactifs · pp, cp : population, plafond · rw : lignes de la feuille (0 = à construire) · ln : longueur des nombres de la barre · op : feuille 0 fermée, 1 ouverte, 2 en fermeture
 rs.innerHTML=[0,1,2,3].map(i=>'<span class="ch c'+i+'"><span class="n"><em>'+['🍖','🪵','🪙','👥'][i]+'</em><span class="v"></span></span><span class="gg"><i class="f"></i><b class="t"></b></span>'+(i>2?'<span class="rbg" hidden></span>':'')+'</span>').join('');
 const ch=[...rs.children].map(e=>({v:e.querySelector('.v'),f:e.querySelector('.f'),t:e.querySelector('.t'),b:e.querySelector('.rbg')}));

 // ---------- revenu mesuré ----------
 const inc=(r,v)=>{bk[r][bi%NB]+=v},   // appelée par engine.js (tick) à chaque dépôt du joueur
 roll=()=>{bi++;nb++;for(const a of bk)a[bi%NB]=0;const m=Math.min(nb,NB-1);rt=nb<3?[null,null,null]:bk.map(a=>a.reduce((s,v)=>s+v,0)/(m*BL)*60)},
 // ---------- objectifs : prix de la prochaine grosse dépense qui demande chaque ressource ----------
 goals=()=>{
  const l=[];if(era<2)l.push([AGE[era],'Âge '+['II','III'][era]]);
  if(!E.some(o=>o.t=='c'&&!o.m))l.push([CK.c,Ages.nm('c','Château')]);
  return[0,1,2].map(r=>{let g=l.find(a=>a[0][r]);
   if(!g)Tech.D.forEach((t,i)=>{const s=Tech.st(i);if(t.c[r]&&s!='ok'&&s!='lock'&&(!g||t.c[r]<g[0][r]))g=[t.c,Tech.nm(i)]});
   return g?{g:g[0][r],n:g[1]}:null})},
 // population, villageois par ressource, inactifs, objectifs : 10 fois par seconde
 scan=()=>{pp=pop();cp=cap();vc=[0,0,0];id=0;for(const o of E)if(o.t=='v'&&!o.m){if(!o.st)id++;else if(o.st=='g'||o.st=='d')vc[o.rt]++}go=goals()},
 fresh=()=>{bk=[0,1,2].map(()=>new Float32Array(NB));bi=nb=0;rt=[null,null,null];go=[null,null,null];vc=[0,0,0];id=pp=cp=0;cEra=-1;rw=0;ln=-1;la=''};
 fresh();

 // ---------- barre du haut : appelée à chaque image, n’écrit que ce qui change ----------
 function strip(){
  for(let i=0;i<3;i++){const v=R[i]|0,g=go[i],e=ch[i];tx(e.v,v);wd(e.f,g?Math.min(100,v/g.g*100)|0:0);hd(e.t,!g)}
  const e=ch[3];if(e._a!==pp||e._b!==cp){e._a=pp;e._b=cp;e.v.textContent=pp+'/'+cp}
  wd(e.f,Math.min(100,pp/cp*100)|0);hd(e.b,pp<cp);   // pastille rouge : population pleine
  const n=dg(R[0]|0)+dg(R[1]|0)+dg(R[2]|0)+dg(pp)+dg(cp);if(n!==ln){ln=n;fit()}
  const t=performance.now();
  if(t-ta>1e3){ta=t;const s='Ressources : vivres '+(R[0]|0)+', bois '+(R[1]|0)+', or '+(R[2]|0)+', population '+pp+' sur '+cp;if(s!==la){la=s;rs.setAttribute('aria-label',s)}}
 }
 // Nombres longs : la police rétrécit (k4, k5) jusqu’à ce que les puces tiennent à côté des boutons du haut
 function fit(){const x=$('tb').getBoundingClientRect().left-10;for(const k of['','k4','k5']){rs.className=k;if(rs.lastChild.getBoundingClientRect().right<=x)break}}

 // ---------- feuille de détail ----------
 // Construite à la première ouverture, puis à chaque changement d’âge ou de partie (sprites de l’âge et du terrain)
 function build(){
  const img=(v,k)=>{const o=document.createElement('canvas');o.width=v.width*k;o.height=v.height*k;const x=o.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(v,0,0,o.width,o.height);return'<img alt="" src="'+o.toDataURL()+'" width="'+o.width+'" height="'+o.height+'">'},
  vil=r=>(era&&Ages.spr({t:'v',rt:r,m:0,fx:1}))||Px.spU(0),
  ic=[img(im('b',8,6,PRM,()=>rows(BUSH)),4),img(im('t',12,13,PRM,()=>rows(TREE)),3),img(im('a',8,5,PRM,()=>rows(GOLD)),4),img(vil(0),3)];
  rp.innerHTML=[0,1,2,3].map(i=>'<div class="rr c'+i+'" role="group" aria-label="'+(i<3?NM[i]:'Population')+'"><span class="ic">'+ic[i]+'</span><div class="m"><div class="l1"><b class="nb"></b><span class="of"></span><span class="rt">'+(i<3?img(vil(i),1)+'<u></u><span class="rv"></span>':'<span class="pl">PLEIN</span>')+'</span></div><div class="l2"><span class="gg" aria-hidden="true"><i class="f"></i><b class="t"></b></span><span class="lb"></span></div></div>'
   +(i<3?'<button type="button" class="ra" data-r="'+i+'" aria-label="Envoyer un villageois inactif récolter '+LB[i]+'">'+img(vil(i),2)+'<small>+1</small></button>'
    :'<button type="button" class="ra" data-r="3" aria-label="Construire une maison ('+cost(CK.h)+')"><i>🏠</i><small>'+cost(CK.h)+'</small></button>')+'</div>').join('');
  rw=[...rp.children].map(e=>({nb:e.querySelector('.nb'),of:e.querySelector('.of'),rt:e.querySelector('.rt'),u:e.querySelector('u'),rv:e.querySelector('.rv'),pl:e.querySelector('.pl'),f:e.querySelector('.f'),t:e.querySelector('.t'),lb:e.querySelector('.lb'),b:e.querySelector('.ra')}));
 }
 function sheet(){
  for(let i=0;i<3;i++){
   const w=rw[i],v=R[i]|0,g=go[i],r=rt[i]==null?-1:Math.round(rt[i]*SP/5)*5;   // r : revenu par minute à la vitesse en cours (−1 : pas encore mesuré)
   tx(w.nb,v);tx(w.of,g?'/ '+g.g:'');wd(w.f,g?Math.min(100,v/g.g*100)|0:0);hd(w.t,!g);
   tx(w.u,vc[i]);tx(w.rv,r<0?'—':'+'+r+'/min');
   const s=vc[i]+' villageois, '+(r<0?'revenu inconnu':r+' par minute');if(w.rt._s!==s){w.rt._s=s;w.rt.setAttribute('aria-label',s)}
   tx(w.lb,g?g.n+' · '+(v>=g.g?'prêt':r>0?dur((g.g-v)/(r/60)):'—'):'Plus d’objectif');
   w.b.classList.toggle('no',!id)}
  const w=rw[3];tx(w.nb,pp);tx(w.of,'/ '+cp);wd(w.f,Math.min(100,pp/cp*100)|0);hd(w.pl,pp<cp);tx(w.lb,id+(id>1?' inactifs':' inactif'));w.b.classList.toggle('no',!afford(CK.h));
 }
 // +1 : envoie le villageois inactif le plus proche d’une ressource de ce type en vue (comme un toucher sur la ressource, ui.js)
 function send(r){
  let b,u,m=1e9,q=0;
  for(const o of E)if(o.t=='v'&&!o.m&&!o.st){q=1;const n=near(o,900,x=>x.k=='r'&&x.t==r&&x.n>0&&!Fog.hid(x)&&(!x.fm||x.own)&&Nav.sees(o,x,900));if(n&&dist(o,n)<m){m=dist(o,n);b=n;u=o}}
  if(!u)return toast(q?'Aucune ressource de ce type en vue : explore la carte':'Aucun villageois inactif');
  if(u.cg>0&&u.rt!=b.t)u.st='d';else{u.rt=b.t;u.st='g'}
  u.tg=b.id;const n=performance.now();FX.push({x:b.x,y:b.y,s:n,c:'#facc15',l:'Récolte '+LB[r]});b.bs=n;
  vib(10);scan();sheet();
 }
 rp.onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=+b.dataset.r;if(r<3)send(r);else{plc('h');if(place)shut()}};   // Maison : même pose que dans le menu Bâtir
 // Ouvre la feuille (elle remplace un menu du bas ouvert, au même endroit) ou la referme
 function toggle(){
  if(op==1)return shut();
  const sw=PN?1:0;if(PN)panel(0);
  scan();if(!rw)build();sheet();
  clearTimeout(tm);op=1;rs.setAttribute('aria-expanded',true);rp.className=sw?'sw':'in';rp.hidden=false;
 }
 // Referme la feuille en fondu (now : tout de suite)
 function shut(now){
  if(!op)return;
  rs.setAttribute('aria-expanded',false);clearTimeout(tm);
  if(now){op=0;rp.hidden=true;rp.className='';return}
  op=2;rp.className='out';tm=setTimeout(()=>{if(op==2){op=0;rp.hidden=true;rp.className=''}},130);
 }
 // Nouvelle partie (appelée par init, engine.js) : revenu remis à zéro, feuille fermée
 function reset(){fresh();shut(1);scan();cEra=era}

 // Appelée à chaque image par engine.js (loop)
 function sync(){
  if(!(run&&!end)){shut(1);return}
  while(bi<(T/BL|0))roll();
  if(era!==cEra){cEra=era;rw=0}
  const t=performance.now();
  if(t-ts>=100){ts=t;scan();if(op==1){if(!rw)build();sheet()}}
  strip();
  if(op==1&&PN)shut();   // un menu du bas vient de s’ouvrir : la feuille lui cède la place
 }
 rs.onclick=toggle;
 c.addEventListener('pointerdown',()=>{if(op==1)shut()});   // un toucher sur la carte referme la feuille (et agit normalement), comme pour les menus (hud.js)
 addEventListener('keydown',e=>{if(e.key=='Escape'&&op==1)shut()});
 addEventListener('resize',()=>{ln=-1});
 return{sync,inc,reset,toggle,close:shut}
})();
</script>
<script>
/* pix.js — outils de dessin pixel art partagés par l'accueil (home.js), la carte de campagne (campaign.js) et les écrans Skins / Réglages / Forge / Aide (screens.js).
 * Script classique : définit l'objet global `Px`. À charger après renderer.js (sprites) et avant home.js, campaign.js, screens.js.
 * Utilise, à l'exécution : engine.js ($), renderer.js (im, tp, rows, usp, US, PU, PB, PR, BL, TREE), skins.js (skinCur).
 * Principe : on dessine en pixels « logiques » sur une surface S (S.k pixels de canvas par pixel logique).
 * À l'écran, 1 pixel logique = Px.m.s pixels de l'appareil (entier) = Px.m.u pixels CSS (variable CSS --u).
 * Un écran fait Px.m.w × Px.m.h pixels logiques : 131 × 284 sur un iPhone 15, un peu plus large ou plus haut ailleurs.
 * Les écrans s'affichent dans #px (une seule fois à la fois) : Px.show(build) puis Px.hide().
 */
const Px=(()=>{
 // ---------- mesure de l'écran ----------
 // s : pixels appareil par pixel logique (entier) ; d : densité ; u = s/d : pixels CSS par pixel logique ;
 // w, h : taille de l'écran en pixels logiques ; x, y : décalage CSS (≤ 0) qui centre la scène ; t, b : zones sûres haut/bas en pixels logiques.
 const m={s:3,d:1,u:3,w:131,h:284,x:0,y:0,t:0,b:0},P={on:0,cur:null};
 const meas=()=>{
  const d=devicePixelRatio||1,W=Math.round(innerWidth*d),H=Math.round(innerHeight*d),s=Math.max(2,Math.floor(Math.min(W/131,H/250)));
  m.d=d;m.s=s;m.u=s/d;m.w=Math.ceil(W/s);m.h=Math.ceil(H/s);m.x=Math.floor((W-m.w*s)/2)/d;m.y=Math.floor((H-m.h*s)/2)/d;
  const p=document.createElement('div');p.style.cssText='position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)';document.body.appendChild(p);
  const cs=getComputedStyle(p);m.t=Math.ceil((parseFloat(cs.paddingTop)||0)*d/s);m.b=Math.ceil((parseFloat(cs.paddingBottom)||0)*d/s);p.remove();
  document.documentElement.style.setProperty('--u',m.u+'px');return m};
 // Affiche l'écran : vide #px puis appelle build(#px). Un changement de taille reconstruit l'écran.
 const show=build=>{meas();const e=$('px');e.innerHTML='';e.style.display='block';document.body.classList.add('pxon');P.on=1;P.cur=build;build(e)};
 const hide=()=>{P.on=0;P.cur=null;document.body.classList.remove('pxon');const e=$('px');e.style.display='none';e.innerHTML=''};
 // Zone logique centrée (m.w × m.h pixels logiques) dans le parent ; ses enfants se placent en pixels logiques.
 const pw=par=>{const w=document.createElement('div');w.className='pw';w.style.cssText='left:'+m.x+'px;top:'+m.y+'px;width:'+m.w*m.u+'px;height:'+m.h*m.u+'px';par.appendChild(w);return w};
 let rt=0;addEventListener('resize',()=>{if(!P.on)return;clearTimeout(rt);rt=setTimeout(()=>P.on&&P.cur&&show(P.cur),150)});

 // ---------- nombres, couleurs ----------
 const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const hs=(x,y,s=0)=>{let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1274126177);h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296};
 const sm=t=>t*t*(3-2*t);
 const vn=(x,y,s)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=sm(x-x0),fy=sm(y-y0),a=hs(x0,y0,s),b=hs(x0+1,y0,s),c=hs(x0,y0+1,s),d=hs(x0+1,y0+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
 const fbm=(x,y,s,o=4)=>{let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){v+=a*vn(x*f,y*f,s+i*31);n+=a;a*=.5;f*=2}return v/n};
 const hex=c=>{c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]};

<script>
/* fog.js — brouillard de guerre « Brume sombre » (vision, zones explorées mémorisées, rendu pixel tramé) et minicarte en haut à gauche (toucher ou glisser = déplacer la vue).
 * Script classique (pas de module ES) : les déclarations de premier niveau sont partagées entre les fichiers.
 * Ordre de chargement : engine.js … hud.js, pix.js, fog.js, home.js, campaign.js, screens.js, ui.js (voir index.html).
 * Utilise, à l’exécution, des éléments définis dans :
 *   engine.js : $, E, W, c, cam, clamp, end, mil, run · skins.js : skinCur · pix.js : Px
 * Utilisé par engine.js (init : Fog.reset · loop : Fog.step), renderer.js (draw : Fog.hid, Fog.draw) et ui.js (pick : Fog.hid · tap : Fog.exp).
 * Règles : le joueur voit autour de ses unités et bâtiments (rayons dans vr) ; une zone vue reste explorée (assombrie) ; les unités ennemies
 * ne sont visibles qu’en vue directe ; un bâtiment ennemi vu reste affiché (assombri) ; les ressources d’une zone inconnue ne sont pas touchables.
 * On ne peut poser un bâtiment que sur une zone explorée (ui.js, tap). L’IA ignore le brouillard. Fog.on = 0 désactive tout (brouillard et minicarte). Rayons de vision, bord et bruit : constantes ci-dessous.
 */
const Fog=(()=>{
 const P=4,N=W/P,ED=46,NA=120,          // P : px de monde par pixel de brouillard · N : grille N × N · ED : largeur du bord tramé (px de monde) · NA : amplitude du bruit du bord
 MS=46,FR=3,MN=MS+2*FR,                 // minicarte : MS × MS pixels de carte + cadre de FR pixels (MN = 52 pixels, affichés à 2 px écran)
 BT=new Float32Array(16),
 UN=Px.U('#0b0816'),DM=((UN&0xffffff)|(143<<24))>>>0,   // brouillard : zone inconnue (opaque) · zone vue mais hors de vue (alpha .56)
 GR=['#6a9a4e','#527f3b','#5f8f45'],UG=GR.map(Px.U),UD=GR.map(g=>Px.U(Px.mix(g,'#0b0816',.56))),
 F={on:0};
 for(let i=0;i<16;i++)BT[i]=Px.bay(i&3,i>>2)*255;
 let gen=0,wb,vb,qn=-1,qi=0,SQ=[],MK,nf,ex,vi,nz,fim,fg,o32,fcv,mm,mg,mb,bg,mim,m32,fr,SI,TI,tm,sh,dr;   // ex : explorée · vi : en vue (0 à 255, bord progressif) · nz : bruit du bord
 const ix=(x,y)=>Math.max(0,Math.min(N-1,y/P|0))*N+Math.max(0,Math.min(N-1,x/P|0)),
 // Rayon de vision d’une unité ou d’un bâtiment (px de monde)
 vr=o=>o.k=='b'?(o.t=='tc'?230:o.t=='w'?220:150):o.t=='e'?300:o.kn?170:mil(o)?150:110,   // éclaireur : 300
 // Ajoute un disque de vision (bord bruité) à la grille en vue et à la grille explorée
 // disque précalculé par rayon (KC, sans racine carrée), source ramenée au centre de sa case (4 px) ; une seule fois par case et par rayon à chaque mise à jour (MK)
 KC={},kern=r=>{let k=KC[r];if(!k){const R=Math.ceil((r+ED/2+NA/2)/P),S=2*R+1,a=new Float32Array(S*S);for(let y=0;y<S;y++)for(let x=0;x<S;x++)a[y*S+x]=(r-Math.hypot((x-R)*P,(y-R)*P))*255/ED+127.5;k=KC[r]={R,S,a}}return k},
 stamp=(vx,vy,r)=>{
  const cx=Math.max(0,Math.min(N-1,vx/P|0)),cy=Math.max(0,Math.min(N-1,vy/P|0)),m=gen*512+r;if(MK[cy*N+cx]===m)return;MK[cy*N+cx]=m;
  const {R,S,a}=kern(r),x0=Math.max(0,cx-R),x1=Math.min(N-1,cx+R),y0=Math.max(0,cy-R),y1=Math.min(N-1,cy+R);
  for(let y=y0;y<=y1;y++){const r0=y*N,k0=(y-cy+R)*S+R-cx;
   for(let x=x0;x<=x1;x++){const i=r0+x,q=a[k0+x]-nf[i];
    if(q>0){const v=q>=255?255:q|0;if(v>wb[i])wb[i]=v;if(v>ex[i])ex[i]=v}}}},
 // Texture du brouillard (grille N × N, tramage de Bayer) : inconnue = opaque · vue mais hors de vue = assombrie · en vue = transparente
 paint=()=>{
  for(let y=0;y<N;y++){const r0=y*N,b1=(y&3)*4,b2=((y+1)&3)*4;
   for(let x=0;x<N;x++){const i=r0+x;o32[i]=255-ex[i]>BT[b1+(x&3)]?UN:255-vi[i]>BT[b2+((x+2)&3)]?DM:0}}
  fg.putImageData(fim,0,0)},
 // Minicarte : terrain, brouillard, ressources, bâtiments, unités (dans mb) ; le cadre de la vue est ajouté à chaque image par cadre()
 mini=()=>{
  for(let i=0;i<MS*MS;i++){const s=SI[i],x=i%MS,y=i/MS|0,t=TI[i];
   m32[i]=255-ex[s]>BT[(y&3)*4+(x&3)]?UN:255-vi[s]>BT[((y+1)&3)*4+((x+2)&3)]?UD[t]:UG[t]}
  bg.putImageData(mim,FR,FR);
  const dot=(o,col)=>{bg.fillStyle=col;bg.fillRect(FR+Math.min(MS-1,o.x/W*MS|0),FR+Math.min(MS-1,o.y/W*MS|0),1,1)};
  for(const o of E)if(o.k=='r'&&!o.fm&&ex[ix(o.x,o.y)]>127)dot(o,['#c8283a','#2f6b2a','#f2c230'][o.t]);
  for(const o of E)if(o.k=='b'&&(!o.m||o.sn)){const z=o.t=='tc'?3:2,x=Math.min(MS-z,Math.max(0,(o.x/W*MS|0)-(z>>1))),y=Math.min(MS-z,Math.max(0,(o.y/W*MS|0)-(z>>1)));
   bg.fillStyle='#241c0c';bg.fillRect(FR+x-1,FR+y-1,z+2,z+2);bg.fillStyle=o.m?'#dc2626':skinCur().c;bg.fillRect(FR+x,FR+y,z,z)}
  for(const o of E)if(o.k=='u'&&(!o.m||vi[ix(o.x,o.y)]>127))dot(o,o.m?'#ff6b6b':'#e6f0ff');
  bg.drawImage(fr,0,0)},
 // Minicarte à l’écran : copie de mb + cadre de la zone affichée (à chaque image)
 cadre=()=>{
  mg.clearRect(0,0,MN,MN);mg.drawImage(mb,0,0);
  const x0=Math.round(cam.x/W*MS),y0=Math.round(cam.y/W*MS),x1=Math.min(MS,Math.round((cam.x+c.clientWidth)/W*MS)),y1=Math.min(MS,Math.round((cam.y+c.clientHeight)/W*MS));
  mg.fillStyle='#f6efd8';mg.fillRect(FR+x0,FR+y0,x1-x0,1);mg.fillRect(FR+x0,FR+y1-1,x1-x0,1);mg.fillRect(FR+x0,FR+y0,1,y1-y0);mg.fillRect(FR+x1-1,FR+y0,1,y1-y0)},
 // Un toucher ou un glissement sur la minicarte centre la vue à cet endroit
 go=e=>{const r=mm.getBoundingClientRect(),k=MN/r.width,fx=Math.max(0,Math.min(MS,(e.clientX-r.left)*k-FR)),fy=Math.max(0,Math.min(MS,(e.clientY-r.top)*k-FR));
  cam.x=fx/MS*W-c.clientWidth/2;cam.y=fy/MS*W-c.clientHeight/2;clamp()},
 // Mise en place unique : bruit du bord, textures, minicarte (terrain et cadre en bois)
 setup=()=>{
  const K=16,G=W/K+2,t=new Float32Array(G*G);nz=new Int8Array(N*N);ex=new Uint8Array(N*N);vi=new Uint8Array(N*N);
  for(let y=0;y<G;y++)for(let x=0;x<G;x++)t[y*G+x]=(Px.fbm(x*K*.007,y*K*.007,3)-.5)*NA;
  for(let y=0;y<N;y++){const gy=(y+.5)*P/K,y0=gy|0,fy=gy-y0;
   for(let x=0;x<N;x++){const gx=(x+.5)*P/K,x0=gx|0,fx=gx-x0,i=y0*G+x0;
    nz[y*N+x]=t[i]*(1-fx)*(1-fy)+t[i+1]*fx*(1-fy)+t[i+G]*(1-fx)*fy+t[i+G+1]*fx*fy}}
  nf=new Float32Array(N*N);for(let i=0;i<N*N;i++)nf[i]=nz[i]*255/ED;MK=new Float64Array(N*N);vb=new Uint8Array(N*N);
  fcv=document.createElement('canvas');fcv.width=fcv.height=N;fg=fcv.getContext('2d');fim=fg.createImageData(N,N);o32=new Uint32Array(fim.data.buffer);
  mm=$('mm');mm.width=mm.height=MN;mg=mm.getContext('2d');
  mb=document.createElement('canvas');mb.width=mb.height=MN;bg=mb.getContext('2d');mim=bg.createImageData(MS,MS);m32=new Uint32Array(mim.data.buffer);
  SI=new Int32Array(MS*MS);TI=new Uint8Array(MS*MS);
  for(let y=0;y<MS;y++)for(let x=0;x<MS;x++){const wx=(x+.5)*W/MS,wy=(y+.5)*W/MS,n=Px.fbm(wx*.004,wy*.004,2);
   SI[y*MS+x]=ix(wx,wy);TI[y*MS+x]=Px.hs(x,y,1)<.08?1:n>.56?0:n<.42?1:2}
  fr=document.createElement('canvas');fr.width=fr.height=MN;const q=fr.getContext('2d'),R=(x,y,w,h,col)=>{q.fillStyle=col;q.fillRect(x,y,w,h)},L=MN;   // cadre en bois
  R(1,0,L-2,1,'#241c0c');R(1,L-1,L-2,1,'#241c0c');R(0,1,1,L-2,'#241c0c');R(L-1,1,1,L-2,'#241c0c');
  R(1,1,L-2,1,'#b07a3c');R(1,1,1,L-2,'#b07a3c');R(2,L-2,L-3,1,'#5c3a1a');R(L-2,2,1,L-3,'#5c3a1a');
  R(2,2,L-4,1,'#8b5a2b');R(2,2,1,L-4,'#8b5a2b');R(3,L-3,L-5,1,'#8b5a2b');R(L-3,3,1,L-5,'#8b5a2b');
  mm.onpointerdown=e=>{dr=1;mm.setPointerCapture(e.pointerId);go(e);e.preventDefault()};
  mm.onpointermove=e=>{if(dr)go(e)};
  mm.onpointerup=mm.onpointercancel=()=>{dr=0}};
 // Recalcule la vue et mémorise les zones explorées (5 fois par seconde environ)
 F.upd=()=>{
  vi.fill(0);gen++;wb=vi;qn=-1;
  for(const o of E)if(!o.m&&(o.k=='u'||o.k=='b'))stamp(o.x,o.y,vr(o));
  done()};
 const done=()=>{for(const o of E)if(o.k=='b'&&o.m&&!o.sn&&F.vis(o.x,o.y))o.sn=1;paint();mini()},
 // En partie, le calcul est étalé sur plusieurs images (au plus 1/6 des sources par image) dans une seconde grille, échangée à la fin : plus de pic toutes les 200 ms
 slice=()=>{wb=vb;const e=Math.min(qn,qi+Math.max(8,Math.ceil(qn/6)));for(;qi<e;qi++)stamp(SQ[qi*3],SQ[qi*3+1],SQ[qi*3+2]);if(qi>=qn){const v=vi;vi=vb;vb=v;qn=-1;done()}};
 F.vis=(x,y)=>!F.on||vi[ix(x,y)]>127;   // en vue maintenant (tout est en vue si le brouillard est désactivé)
 F.exp=(x,y)=>!F.on||ex[ix(x,y)]>127;   // déjà vue
 // Couleurs de la minicarte (3 tons de sol), changées par terrain.js selon la carte
 F.pal=a=>{a.forEach((c,i)=>{GR[i]=c;UG[i]=Px.U(c);UD[i]=Px.U(Px.mix(c,'#0b0816',.56))})};
 // Vrai si l’élément o ne doit pas être affiché (ou touché) : unité ennemie hors de vue, bâtiment ennemi jamais vu, ressource en zone inconnue
 F.hid=o=>!!F.on&&(o.k=='r'?ex[ix(o.x,o.y)]<128:o.m?(o.k=='b'?!o.sn:vi[ix(o.x,o.y)]<128):false);
 // Nouvelle partie : tout est à découvrir
 F.reset=()=>{if(!ex)setup();ex.fill(0);vi.fill(0);F.on=1;tm=-1e9;sh=null;qn=-1;F.upd()};
 // À chaque image (engine.js, loop) : met à jour la vue ~5 fois par seconde pendant la partie, affiche ou cache la minicarte
 F.step=()=>{
  const s=!!F.on&&!!run&&!end&&!Px.on,t=performance.now();
  if(s&&qn<0&&t-tm>=200){tm=t;qn=qi=0;gen++;vb.fill(0);for(const o of E)if(!o.m&&(o.k=='u'||o.k=='b')){SQ[qn*3]=o.x;SQ[qn*3+1]=o.y;SQ[qn*3+2]=vr(o);qn++}}
  if(s&&qn>=0)slice();
  if(s!==sh){sh=s;mm.style.display=s?'block':'none'}
  if(s)cadre()};
 // Brouillard par-dessus la partie, en pixels écran (appelée par renderer.js, draw, après g.restore)
 F.draw=(g,w,h)=>{
  Lay.set(Lay.F,F.on?fcv:0,P,'transparent')};   // couche CSS sur le canvas (renderer.js, Lay)
 // Reprise d'une partie (reprise.js) : zones explorées, 1 bit par case
 F.sv=()=>{if(!ex)return'';let s='';for(let i=0;i<ex.length;i+=8){let b=0;for(let k=0;k<8;k++)if(ex[i+k]>127)b|=1<<k;s+=String.fromCharCode(b)}return btoa(s)};
 F.ld=d=>{if(!d||!ex)return;const s=atob(d);for(let i=0;i<s.length;i++){const b=s.charCodeAt(i);for(let k=0;k<8;k++)if(b>>k&1)ex[i*8+k]=255}};
 return F;
})();
</script>
<script>
/* army.js — archers (Caserne) et catapultes (Château, Âge II) : caractéristiques, sprites, tirs, projectiles, impacts et icônes du menu Armée.
 * Script classique (pas de module ES) : les déclarations de premier niveau sont partagées entre les fichiers.
 * Ordre de chargement : engine.js … hud.js, pix.js, fog.js, army.js, home.js, campaign.js, screens.js, ui.js (voir index.html).
 * Utilise, à l’exécution, des éléments définis dans :
 *   engine.js : E, MS, T, dist, era, mil, near · renderer.js : IM, PB, PU, Q, US, X, im, rows, tp, usp · skins.js : skinCur · fog.js : Fog · audio.js : Snd · ages.js : Ages (fire : Ages.a · icon : Ages.spr)
 * Utilisé par engine.js (unit : Arm.mk · tick : Arm.acq, Arm.fire · loop : Arm.step · init : Arm.reset), renderer.js (pix : Arm.spr · draw : Arm.draw) et hud.js (fill : Arm.icon).
 * Aux Âges II et III (ages.js), l’archer tire des balles puis des éclairs de plasma et la catapulte devient char puis canon plasma : mêmes règles, projectiles et sons différents.
 * Types d’unités : 'a' = archer (flèche qui suit sa cible), 'm' = catapulte (boulet lancé sur un point : dégâts de zone, ×2 contre les bâtiments).
 * Les unités à distance ont une portée rg (px) et un délai entre deux tirs cr (s) ; tout est calé sur le temps de jeu (figé en pause).
 */
const Arm=(()=>{
 const PJ=[],DU=[],IC={},   // PJ : projectiles en vol · DU : poussières d’impact (et dégâts affichés) · IC : icônes du menu, par skin
 XU={f:'#f2f2f2',r:'#d6403a',l:'#b88a4a'},   // lettres en plus des palettes PU (archer) et PB (catapulte)
 AR=['...oooooo...','.fottttttow.','frotkssktofw','r.oTssssTofW','..oTTTTTTofW','.ottttttttfW','.ottttttttWW','.oskkkkkksWW','..ottttttoWW','..oTTTTTTofW','...pp..pp..w','...pp..pp.w.','...kk..kk...'],   // archer 12×13 : capuche d’équipe, arc à droite, plumes à gauche
 wheel=(x,y)=>{Q(x-1,y-2,3,1,'k');Q(x-2,y-1,5,3,'k');Q(x-1,y+2,3,1,'k');Q(x-1,y-1,3,3,'w');Q(x,y,1,1,'W');Q(x-1,y-1,1,1,'l')},
 // catapulte blindée 20×16 : caisse de bois, pavois d’équipe à l’avant (à droite), bras, godet et pierre
 CT=()=>{
  wheel(5,13);wheel(14,13);
  Q(1,9,18,4,'W');Q(2,9,16,1,'w');Q(2,10,16,2,'w');for(let x=4;x<14;x+=4)Q(x,10,1,2,'W');
  Q(13,8,6,5,'t');Q(13,8,6,1,'y');Q(13,12,6,1,'T');Q(16,9,1,3,'T');
  Q(3,6,4,3,'l');Q(3,6,4,1,'y');Q(4,7,2,1,'k');
  Q(7,7,3,2,'W');Q(9,6,2,1,'W');Q(10,5,2,1,'W');Q(11,4,2,1,'W');Q(12,3,2,1,'W');Q(13,2,2,1,'W');
  Q(14,2,5,2,'W');Q(14,2,5,1,'l');
  Q(14,0,5,2,'s');Q(15,2,3,1,'S');Q(17,0,2,2,'S');Q(15,0,1,1,'f');
  Q(1,3,1,6,'k');Q(2,3,3,2,'t')},
 // Sprite de l’unité o (mis en cache dans IM, vidé au changement de skin) ; retourné si elle regarde à gauche (o.fx = -1)
 spr=o=>{const a=o.t=='a',m=o.m||0,k=(a?'ua':'um')+m,w=a?12:20,h=a?13:16,
  b=im(k,w,h,{...tp(a?PU:PB,m),...XU},a?()=>rows(AR):CT);
  return o.fx<0?im(k+'f',w,h,0,()=>{X.translate(w,0);X.scale(-1,1);X.drawImage(b,0,0)}):b},
 // Caractéristiques d’une nouvelle unité 'a' ou 'm' (appelée par unit() ; q = niveau × BS) : pv, vitesse, dégâts, rayon, portée, délai de tir
 mk=(t,m,q)=>t=='a'?{...pv((40+(m?T/12|0:0))*q),sp:60*MS,at:6*q,r:16,rg:150,cr:1.1}
  :{...pv(100*q),sp:42*MS,at:40*q,r:24,rg:260,cr:3.4},
 pv=h=>({hp:h,mh:h}),
 // Cible automatique dans la portée de u (visible seulement) : l’archer préfère les unités, la catapulte les bâtiments
 acq=u=>{const f=o=>o.m==1-u.m&&!Fog.hid(o),b=o=>f(o)&&o.k=='b',v=o=>f(o)&&o.k=='u';
  return u.t=='m'?near(u,u.rg,b)||near(u,u.rg,v):near(u,u.rg,v)||near(u,u.rg,b)},
 // Tir de u sur t : une flèche (suit sa cible, ×0,5 contre un bâtiment) ou un boulet (vise un point, dégâts de zone)
 fire=(u,t)=>{
  const a=u.t=='a',d=dist(u,t),s=t.x<u.x?-1:1,e=Ages.a(u);u.cd=u.cr;u.fx=s;   // e : âge du tireur (0 flèche / boulet, 1 balle / obus, 2 plasma)
  PJ.push(a?{a:1,e,u,tg:t,m:u.m,x0:u.x+s*(e?10:7),y0:u.y-(e?9:8),x1:t.x,y1:t.y,d:u.at*(t.k=='b'?.5:1),t:0,du:Math.max(.15,d/(380+e*400)),hg:e?0:Math.min(70,d*.3)}
   :{a:0,e,u,tg:t,m:u.m,x0:u.x+s*(e?26:16),y0:u.y-(e?3:12),x1:t.x,y1:t.y,d:u.at,t:0,du:Math.max(.6,d/(200+e*200)),hg:Math.min(130,d*(e?.2:.45))});
  Snd.at([['arc','fusil','laser'],['catapulte','obus','plasma']][a?0:1][e],u.x,u.y)},
 // Une unité militaire au repos touchée par un tir riposte contre le tireur
 react=(o,p)=>{if(o.k=='u'&&mil(o)&&!o.st&&p.u.hp>0){o.st='a';o.tg=p.u.id}},
 // Impact d’un boulet : dégâts à tous les ennemis dans 36 px (bâtiments : ×2), poussière et dégâts affichés
 land=p=>{let n=0,mx=0;
  for(const o of E)if(o.m==1-p.m&&(o.k=='u'||o.k=='b')&&o.hp>0&&Math.hypot(o.x-p.x1,o.y-p.y1)<=36+(o.sz||0)/2){const q=p.d*(o.k=='b'?2:1);o.hp-=q;n++;mx=Math.max(mx,q);react(o,p)}
  DU.push({x:p.x1,y:p.y1,t:0,e:p.e,l:n?'-'+Math.round(mx):0});Snd.at('impact',p.x1,p.y1)},
 // Fait avancer les projectiles et les poussières (engine.js, loop)
 step=dt=>{
  for(const p of PJ){
   p.t+=dt;
   if(p.a&&p.tg.hp>0){p.x1=p.tg.x;p.y1=p.tg.y-(p.tg.k=='b'?0:4)}
   if(p.t<p.du)continue;
   p.t=-1;
   if(p.a){if(p.tg.hp>0){p.tg.hp-=p.d;react(p.tg,p)}}else land(p)}
  for(let i=PJ.length-1;i>=0;i--)if(PJ[i].t<0)PJ.splice(i,1);
  for(let i=DU.length-1;i>=0;i--)if((DU[i].t+=dt)>.7)DU.splice(i,1)},
 // Dessin dans le monde (renderer.js, draw : avant les effets d’ordres)
 draw=g=>{
  for(const p of PJ){
   const u=Math.min(1,p.t/p.du),f=v=>[p.x0+(p.x1-p.x0)*v,p.y0+(p.y1-p.y0)*v-p.hg*Math.sin(Math.PI*v)];
   if(p.a){
    const[x,y]=f(u),[xa,ya]=f(Math.max(0,u-.04)),[xb,yb]=f(Math.min(1,u+.04));
    for(let i=1;i<=4;i++){const[a,b]=f(Math.max(0,u-i*.05));g.globalAlpha=.5-i*.1;g.fillStyle=p.e>1?'#5fe0ff':p.e?'#ffe08a':'#f4efd8';g.fillRect(Math.round(a)-1,Math.round(b)-1,2,2)}
    g.globalAlpha=1;g.save();g.translate(x,y);g.rotate(Math.atan2(yb-ya,xb-xa));
    if(p.e){g.fillStyle=p.e>1?'#2aa8c8':'#e8a33a';g.fillRect(-9,-1.5,12,3);g.fillStyle=p.e>1?'#5fe0ff':'#ffe08a';g.fillRect(-6,-1,12,2);g.fillStyle='#fff';g.fillRect(2,-1,5,2)}   // balle traçante (Âge II), éclair de plasma (Âge III)
    else{g.fillStyle='#6b4a2a';g.fillRect(-9,-1,14,2);g.fillStyle='#f2f2f2';g.fillRect(-11,-2,4,4);g.fillStyle='#cfd5db';g.fillRect(5,-1.5,4,3)}
    g.restore()
   }else{
    const gx=p.x0+(p.x1-p.x0)*u,gy=p.y0+(p.y1-p.y0)*u,by=gy-p.hg*Math.sin(Math.PI*u);
    for(let i=1;i<=6;i++){const v=Math.max(0,u-i*.045),[a,b]=f(v);g.globalAlpha=Math.max(0,.55-i*.07);g.fillStyle=p.e>1?'#5fe0ff':p.e?'#8a8f96':'#d8d2c2';g.fillRect(Math.round(a)-2,Math.round(b)-2,4,4)}
    g.globalAlpha=.3;g.fillStyle='#0b1a0d';g.beginPath();g.ellipse(gx,gy+4,12,4,0,0,7);g.fill();g.globalAlpha=1;
    const bx=Math.round(gx),by2=Math.round(by);
    if(p.e>1){g.fillStyle='#2aa8c8';g.fillRect(bx-7,by2-7,14,14);g.fillStyle='#5fe0ff';g.fillRect(bx-5,by2-5,10,10);g.fillStyle='#fff';g.fillRect(bx-2,by2-2,4,4)}   // boule de plasma
    else if(p.e){g.fillStyle='#2a2f36';g.fillRect(bx-4,by2-4,8,8);g.fillStyle='#ffb347';g.fillRect(bx-4,by2-4,3,8);g.fillStyle='#fde68a';g.fillRect(bx-4,by2-2,2,4)}   // obus
    else g.drawImage(im('rock',5,5,{s:PB.s,S:PB.S,f:XU.f},()=>{Q(1,0,3,1,'s');Q(0,1,5,3,'s');Q(1,4,3,1,'S');Q(3,1,2,3,'S');Q(1,1,1,1,'f')}),Math.round(gx-9),Math.round(by-9),18,18)}
  }
  const col=[['#efe3c2','#d8c79a','#b9a678','#f6efd8'],['#6b645a','#3a3a3a','#ffb347','#fde68a'],['#5fe0ff','#2aa8c8','#f4f6f8','#9aa1aa']];   // poussière, fumée et feu, étincelles de plasma
  for(const d of DU){
   const k=d.t/.7,cl=col[d.e|0];
   for(let i=0;i<16;i++){const a=i*2.4,r=(6+(i*7)%18)*(.5+k*.9),s=3+(i%3)*2;g.globalAlpha=Math.max(0,.85-(i%4)*.15)*(1-k);g.fillStyle=cl[i%4];g.fillRect(Math.round(d.x+Math.cos(a)*r)-s/2,Math.round(d.y-Math.abs(Math.sin(a))*r*.8)-s/2,s,s)}
   if(d.l){g.globalAlpha=1-k;g.font='600 13px Bitter,Georgia,serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=3;g.strokeStyle='#000';g.fillStyle='#fde68a';g.strokeText(d.l,d.x+4,d.y-34-k*14);g.fillText(d.l,d.x+4,d.y-34-k*14)}
  }
  g.globalAlpha=1},
 // Icône d’une carte du menu Armée (sprite agrandi 2×, en <img>), mémorisée par skin ; k = clé de TRAIN ('' si inconnue : le menu garde son émoji)
 icon=k=>{
  if(!'sakmpxe'.includes(k))return'';
  if(k=='p'||k=='x'||k=='e'){const v=k!='x'?im('ic'+k+skinCur().id,12,13,tp(PU,0),()=>rows(usp(US[k=='p'?5:6]))):im('x0',20,16,tp(PB,0),BL.x);return'<img alt="" src="'+v.toDataURL()+'" width="'+v.width*2+'" height="'+v.height*2+'">'}
  const i=k+skinCur().id+era;
  return IC[i]||(IC[i]=(()=>{const v=Ages.spr({t:k=='k'?'s':k,kn:k=='k',m:0,fx:1})||(k=='a'||k=='m'?spr({t:k}):im('ic'+k,12,13,tp(PU,0),()=>rows(usp(US[k=='s'?3:4]))));
   return'<img alt="" src="'+v.toDataURL()+'" width="'+v.width*2+'" height="'+v.height*2+'">'})())},
 // Nouvelle partie : plus de projectiles
 reset=()=>{PJ.length=0;DU.length=0};
 return{mk,acq,fire,step,draw,spr,icon,reset}
})();
</script>
<script>
/* ages.js — les trois âges : Âge I (médiéval), Âge II (armée moderne, fusils et chars), Âge III (robots).

<script>
/* enemy.js — évolution de l’ennemi : calendrier par niveau, passage d’âge, annonce (bandeau + bords rouges + cor) et pastille d’âge sur la minicarte.
 * Script classique (pas de module ES) : définit l’objet global `Enemy`. À charger après ages.js et pix.js (voir index.html).
 * Utilise, à l’exécution, des éléments définis dans :
 *   engine.js : $, E, FX, L, T, end, eraE, run · ages.js : Ages (scale) · fog.js : Fog (hid) · pix.js : Px · audio.js : Snd · ui.js : toast · adv.js : ADV (annonce : nom de l’adversaire)
 * Utilisé par engine.js (init → reset · loop → sync) et ai.js (aiStep → step).
 * Règle : chaque niveau a L.ea = [seconde de l’Âge II, seconde de l’Âge III] (0 = jamais ; voir LV dans engine.js) ; un préavis s’affiche 30 s avant.
 * À l’évolution, tout ce que l’ennemi possède double de puissance (comme pour le joueur, voir ages.js) ; ce qu’il crée ensuite naît déjà à la puissance de son âge (Ages.fit).
 */
const Enemy=(()=>{
 const NA=['I','II','III'],PRE=30,SHOW=3200,   // PRE : préavis (secondes de jeu) · SHOW : durée de l’annonce (ms)
 // Position CSS (en pixels) d’un élément posé à x, y depuis le coin haut gauche de l’écran, zones sûres comprises
 at=(x,y)=>'left:calc(env(safe-area-inset-left,0px) + '+x+'px);top:calc(env(safe-area-inset-top,0px) + '+y+'px)';
 let warn=[0,0],al=[],bd=0,mm=0;   // préavis déjà donné pour chaque âge · éléments de l’annonce en cours · pastille d’âge (canvas) · minicarte
 const clear=()=>{for(const e of al)e.remove();al=[]},
 // Pastille d’âge de l’ennemi (II ou III) dans le coin bas droit de la minicarte (104 × 104 px, voir hud.css) ; refaite à chaque âge et à chaque changement de taille d’écran
 vis=()=>{mm=mm||$('mm');return eraE>0&&mm.style.display=='block'},
 badge=()=>{
  const m=Px.meas(),u=m.u,w=eraE>1?23:17,h=9,S=Px.surf(w,h,m.s),{RC,ctext}=Px;
  RC(S,0,0,w,h,'#1a0505');RC(S,1,1,w-2,h-2,'#b91c1c');RC(S,1,1,w-2,1,'#ef4444');RC(S,1,h-2,w-2,1,'#7f1d1d');ctext(S,NA[eraE],Math.round(w/2),1,1,'#fde68a');
  if(bd)bd.remove();
  bd=S.cv;bd.dataset.e=eraE;bd.setAttribute('role','img');bd.setAttribute('aria-label','Âge de l’ennemi : '+NA[eraE]);
  bd.style.cssText='position:fixed;image-rendering:pixelated;pointer-events:none;z-index:4;'+at(8+104-w*u,58+104-h*u)+';width:'+w*u+'px;height:'+h*u+'px;display:'+(vis()?'block':'none');
  document.body.appendChild(bd)},
 // Annonce : bandeau rouge « L’ENNEMI ÉVOLUE · ÂGE II · x2 » sous la minicarte + bords rouges qui pulsent, 3 s, sans bloquer le jeu
 announce=()=>{
  clear();
  const m=Px.meas(),u=m.u,w=127,h=32,n=eraE,S=Px.surf(w,h,m.s),{RC,disc,cico,ctext}=Px,v=document.createElement('div');
  RC(S,0,0,w,h,'#1a0505');RC(S,1,1,w-2,h-2,'#7f1d1d');RC(S,1,1,w-2,1,'#b91c1c');RC(S,1,h-4,w-2,3,'#450a0a');
  disc(S,11,16,9,'#1a0505');disc(S,11,16,8,'#dc2626');cico(S,'up',11,16,1,'#fde68a');
  ctext(S,'L\'ENNEMI ÉVOLUE',64,4,1,'#fecaca');
  ctext(S,'ÂGE '+NA[n],64,15,2,'#ffffff',{sh:'#1a0505',shDy:1});
  disc(S,116,16,8,'#1a0505');disc(S,116,16,7,'#facc15');ctext(S,'x'+2**n,116,13,1,'#7f1d1d');
  const b=S.cv;b.setAttribute('role','alert');b.setAttribute('aria-label','L’ennemi évolue : Âge '+NA[n]+', puissance ×'+2**n);
  b.style.cssText='position:fixed;image-rendering:pixelated;pointer-events:none;z-index:7;left:50%;margin-left:'+(-w*u/2)+'px;top:calc(env(safe-area-inset-top,0px) + 172px);width:'+w*u+'px;height:'+h*u+'px';
  v.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:6;box-shadow:inset 0 0 70px 14px rgba(220,38,38,.55)';
  document.body.append(v,b);al=[v,b];
  v.animate([{opacity:0},{opacity:1,offset:.12},{opacity:.35,offset:.35},{opacity:1,offset:.55},{opacity:0}],{duration:SHOW});
  b.animate([{opacity:0},{opacity:1,offset:.08},{opacity:1,offset:.8},{opacity:0}],{duration:SHOW});
  setTimeout(()=>{if(al[0]===v)clear()},SHOW+50)},
 // L’ennemi passe à l’âge suivant : tout ce qu’il possède double de puissance ; les anneaux ne s’affichent que sur ce que le joueur voit (pas de fuite à travers le brouillard)
 up=()=>{
  eraE++;
  const n=performance.now(),h=E.find(o=>o.t=='tc'&&o.m);
  for(const o of E)if(o.m&&o.k!='r'){Ages.scale(o,2);if(!Fog.hid(o))FX.push({x:o.x,y:o.y,s:n,c:o.k=='b'?'#fde68a':'#ffffff'})}
  if(h&&!Fog.hid(h))FX.push({x:h.x,y:h.y-34,s:n,c:'#fca5a5',l:'Âge '+NA[eraE]});
  Snd.play('cor');announce();badge()},
 // Appelée toutes les 2 s par l’IA : préavis 30 s avant l’heure de l’âge suivant, puis évolution
 step=()=>{
  const a=L.ea&&L.ea[eraE],e2=eraE?0:prof().e2|0,t=a&&e2?Math.min(a,e2):a||e2;   // profil e2 (adv.js) : Âge II plus tôt
  if(!t||!E.some(o=>o.t=='tc'&&o.m))return;
  if(T>=t)up();
  else if(T>=t-PRE&&!warn[eraE]){warn[eraE]=1;toast(ADV[L.ad|0].n+' évolue dans '+PRE+' s !')}},
 // Appelée à chaque image : la pastille suit la minicarte (cachée avec elle) ; l’annonce disparaît dès que la partie s’arrête
 sync=()=>{
  if(al.length&&(!run||end||Px.on))clear();
  const s=vis();
  if(s&&(!bd||bd.dataset.e!=eraE))badge();
  else if(bd&&(bd.style.display=='block')!==s)bd.style.display=s?'block':'none'},
 // Nouvelle partie (engine.js, init) : plus d’annonce, plus de pastille, préavis à zéro
 reset=()=>{warn=[0,0];clear();if(bd){bd.remove();bd=0}};
 addEventListener('resize',()=>{if(bd)badge()});
 return{step,up,sync,reset}
})();
</script>
<script>
/* tech.js — technologies « Progrès » : 8 améliorations achetées en partie, aussitôt, avec les ressources du jeu.
 * Script classique (pas de module ES) : les déclarations de premier niveau sont partagées entre les fichiers.
 * Ordre de chargement : engine.js … ages.js, enemy.js, tech.js, home.js … ui.js (voir index.html).
 * Utilise, à l’exécution, des éléments définis dans :
 *   engine.js : E, FX, R, era, mil · skins.js : skinCur · ages.js : Ages (spr : sprite de l’âge) · audio.js : Snd · ui.js : toast
 * Utilisé par engine.js (init → reset · tick → g), ages.js (fit), hud.js (fill → cards · onclick → buy · btns → mark, sync · tabs → ok) et screens.js (écran Progrès : D, st, buy).
 * Chaque technologie s’achète une fois par partie. Ses effets s’appliquent aussitôt à tout ce que le joueur possède, puis à tout ce qu’il produit ensuite, et se cumulent avec le ×2 / ×4 des âges.
 * Le nom et l’icône suivent l’âge du joueur : D[i].n[era] et le sprite de l’âge. Les 4 dernières exigent l’Âge II. L’ennemi n’a pas de technologies.
 * Ajouter une technologie = une entrée dans D (et dans EF si elle modifie des unités ou des bâtiments ; la récolte passe par g()).
 */
const Tech=(()=>{
 const NA=['I','II','III'],
 GA=['paniers','hache','pioche'],   // technologie de récolte de chaque ressource, dans l’ordre de R : vivres, bois, or
 // id · noms aux Âges I, II, III (9 lettres au plus : le parchemin) · effet · effet en pixel [valeur, mot] · coût [vivres, bois, or] · âge requis (0 = Âge I) · émoji de l’Âge I · sprite de l’âge [v : villageois de la ressource n · u : unité s, k, a, m · b : bâtiment]
 D=[
  {id:'hache',n:['Hache','Scierie','Laser'],e:'+25% bois',v:['+25%','BOIS'],c:[0,100,0],a:0,em:'🪓',sp:['v',1]},
  {id:'paniers',n:['Paniers','Engrais','Drones'],e:'+25% vivres',v:['+25%','VIVRES'],c:[0,100,0],a:0,em:'🧺',sp:['v',0]},
  {id:'pioche',n:['Pioche','Foreuse','Nanobots'],e:'+25% or',v:['+25%','OR'],c:[50,100,0],a:0,em:'⛏️',sp:['v',2]},
  {id:'lames',n:['Lames','Balles','Plasma'],e:'+20% dégâts',v:['+20%','DÉGÂTS'],c:[100,0,50],a:0,em:'🗡️',sp:['u','s']},
  {id:'armures',n:['Armures','Kevlar','Blindage'],e:'+25% vie unités',v:['+25%','VIE'],c:[150,0,100],a:1,em:'🛡️',sp:['u','k']},
  {id:'arc',n:['Arc long','Lunette','Viseur'],e:'+20% portée',v:['+20%','PORTÉE'],c:[0,150,100],a:1,em:'🏹',sp:['u','a']},
  {id:'remparts',n:['Remparts','Béton','Bouclier'],e:'+30% vie bâtiments',v:['+30%','VIE'],c:[0,200,100],a:1,em:'🧱',sp:['b','w']},
  {id:'torsion',n:['Torsion','Obus','Fusion'],e:'+30% dégâts',v:['+30%','DÉGÂTS'],c:[0,150,150],a:1,em:'🪨',sp:['u','m']}],
 // effets sur une entité du joueur : [la concerne-t-elle ?, modification] ; mil : unité de combat (guerrier, chevalier, archer, catapulte)
 EF={
  lames:[o=>mil(o),o=>{o.at*=1.2}],
  armures:[o=>mil(o),o=>{o.hp*=1.25;o.mh*=1.25}],
  arc:[o=>o.t=='a',o=>{o.rg*=1.2}],
  remparts:[o=>o.k=='b',o=>{o.hp*=1.3;o.mh*=1.3}],
  torsion:[o=>o.t=='m',o=>{o.at*=1.3}]},
 IC={};   // icônes des cartes (<img>), par technologie, skin et âge
 let own={},dot=-1;   // own : technologies acquises dans la partie · dot : état de la pastille rouge (-1 = à redessiner)
 const cs=c=>c.map((v,i)=>v?v+['🍖','🪵','🪙'][i]:'').filter(x=>x).join(' '),
 // état de la technologie i : ok (acquise) · lock (âge requis non atteint) · buy (achetable) · low (ressources manquantes)
 st=i=>{const t=D[i];return own[t.id]?'ok':t.a>era?'lock':t.c.every((v,j)=>R[j]>=v)?'buy':'low'},
 nm=i=>D[i].n[era],
 ok=()=>D.some((t,i)=>st(i)=='buy'),
 // multiplicateur de ce qui est livré au Forum pour la ressource rt (0 vivres, 1 bois, 2 or)
 g=rt=>own[GA[rt]]?1.25:1,
 ap=(id,o)=>{const f=EF[id];if(f&&f[0](o))f[1](o)},
 // appliquée à toute nouvelle entité du joueur (ages.js, fit) : elle naît avec les effets déjà acquis
 fit=o=>{for(const id in own)ap(id,o);return o},
 // Achète la technologie i ; renvoie 1 si l’achat est fait, sinon 0 avec le message (âge requis, ressources manquantes)
 buy=i=>{
  const t=D[i],s=st(i);
  if(s=='ok')return toast(nm(i)+' : déjà acquise'),0;
  if(s=='lock')return toast('Passe à l’Âge '+NA[t.a]+' pour débloquer '+nm(i)),0;
  if(s=='low')return toast('Il manque des ressources ('+cs(t.c)+')'),0;
  R=R.map((v,j)=>v-t.c[j]);own[t.id]=1;
  for(const o of E)if(!o.m&&o.k!='r')ap(t.id,o);
  const h=E.find(o=>o.t=='tc'&&!o.m);
  if(h)FX.push({x:h.x,y:h.y-34,s:performance.now(),c:'#facc15',l:nm(i)+' '+t.v[0]});
  Snd.play('fin');toast('Progrès : '+nm(i)+' ('+t.e+')');return 1},
 // Icône d’une carte du menu : émoji à l’Âge I, ensuite sprite de l’âge en <img> (agrandi 2×)
 ic=i=>{
  const t=D[i];if(!era)return t.em;
  const k=t.id+skinCur().id+era;
  return IC[k]||(IC[k]=(()=>{const[y,a]=t.sp,v=y=='v'?Ages.spr({t:'v',rt:a,m:0,fx:1}):y=='u'?Ages.spr({t:a=='k'?'s':a,kn:a=='k',m:0,fx:1}):Ages.spr({k:'b',t:a,m:0});
   return'<img alt="" src="'+v.toDataURL()+'" width="'+v.width*2+'" height="'+v.height*2+'">'})())},
 // Cartes du menu Progrès (hud.js) : une par technologie, dans l’ordre de D
 cards=()=>D.map((t,i)=>{const s=st(i);
  return'<button class="cd tc'+(s=='ok'?' ok':s=='buy'?'':' no')+'" data-p="t" data-k="'+i+'"><i>'+ic(i)+'</i><b>'+nm(i)+'</b><small class="ef">'+t.e+'</small><small>'+(s=='ok'?'✅ Acquis':cs(t.c))+'</small><span class="tr">'+(s=='lock'?'🔒':'')+NA[t.a]+'</span></button>'}).join(''),
 // Met à jour la classe d’une carte déjà affichée (appelée à chaque image par hud.js)
 mark=(b,i)=>{const s=st(i);b.classList.toggle('ok',s=='ok');b.classList.toggle('no',s=='lock'||s=='low')},
 // Pastille rouge (bouton Progrès de la barre, bouton du haut, onglet) : visible dès qu’une technologie est achetable
 sync=()=>{const d=ok();if(d===dot)return;dot=d;for(const e of document.querySelectorAll('.bdg'))e.hidden=!d},
 // Nouvelle partie : plus aucune technologie
 reset=()=>{own={};dot=-1};
 return{D,cards,mark,sync,reset,buy,fit,g,nm,ok,st,sv:()=>own,ld:o=>{own=o||{};dot=-1}}
})();
</script>
<script>
/* terrain.js — sol des cartes en pixel art : herbe, ruisseau, chemin, décor ; dessiné une fois par carte, puis recopié à chaque image.
 * Script classique (pas de module ES) : définit l’objet global `Terrain` et les couleurs `PRM` (arbres, baies et rochers dans la partie). À charger après pix.js (voir index.html).
 * Utilise, à l’exécution : engine.js (W, cam) · renderer.js (PR, IM) · pix.js : Px (bruit, couleurs) · fog.js : Fog (pal : couleurs de la minicarte) · maps.js : MAPS (décrit chaque carte).
 * Utilisé par engine.js (init : make, tree), renderer.js (pix : PRM · draw : draw), ui.js (tap : wet), ai.js (spot : wet) et nav.js (make : nv). Utilise nav.js : Nav (wet : ban).
 * Un pixel de sol = GP pixels de monde (2, comme un pixel de sprite). Une carte sans `sk` garde le sol uni des niveaux 1 à 3 ; les 2 dernières cartes dessinées sont gardées en mémoire.
 */
const PRM={...PR},   // couleurs des sprites de ressources dans la partie (PR reste celui de l’accueil et de la campagne)
Terrain=(()=>{
 const GP=2,N=W/GP,{fbm,hs,bay,mix,U}=Px,C={},MM0=['#6a9a4e','#527f3b','#5f8f45'],DEF={g:'#2f6b2a',G:'#4f9a3c'},KEYS=['b','t','a','f'],T={cur:0},
 // Aspects : g = herbe (base, claire, sombre, grains clairs, grains sombres) · hw, hv = demi-largeur du ruisseau et sa variation (pixels de sol) · bk = largeur des berges · cl = rayon sans arbres autour des Forums
 // pr = couleurs des arbres et buissons dans la partie · mm = couleurs de la minicarte
 SK={
  gue:{g:['#62944a','#6c9e53','#588a41','#74a85b','#4e7b39'],hw:9,hv:5,bk:6,cl:0,pr:{g:'#2f6b2a',G:'#4f9a3c'},mm:MM0},
  plaine:{g:['#a59c48','#b3aa55','#938a3d','#c2b966','#827a33'],hw:10,hv:5,bk:6,cl:0,pr:{g:'#4f6a2a',G:'#7a8f3a'},mm:['#b3aa55','#938a3d','#a59c48']},   // chapitre III : herbe dorée, grande rivière
  monts:{g:['#858a84','#959a94','#737872','#acb1aa','#62675f'],hw:8,hv:4,bk:5,cl:0,pr:{g:'#1f3d2e',G:'#2f5a40'},mm:['#959a94','#737872','#858a84'],sa:['#a9aeb4','#b8bcc2','#8c9096','#d2d6da']},   // chapitre IV : roche, torrents
  cendres:{g:['#3d3635','#4a4241','#312b2a','#5e5450','#272221'],hw:9,hv:5,bk:6,cl:0,pr:{g:'#3a2e28',G:'#5a4434'},mm:['#4a4241','#312b2a','#3d3635'],sa:['#4a4040','#554a48','#3a3232','#6a5e58'],wa:['#e86a1e','#f08a28','#f5a623','#ffe9a0','#ffd24a','#8a2a10']},   // chapitre V : sol noir, rivière de lave
  foret:{g:['#3d6c37','#477840','#335d30','#52874a','#2b4f2a'],hw:9,hv:5,bk:6,cl:230,fo:1,pr:{g:'#1a4724',G:'#2f7a3a'},mm:['#477840','#335d30','#3d6c37']},   // sous-bois avec ruisseau (chapitre II)
  bois:{g:['#3d6c37','#477840','#335d30','#52874a','#2b4f2a'],hw:0,hv:0,bk:0,cl:230,fo:1,pr:{g:'#1a4724',G:'#2f7a3a'},mm:['#477840','#335d30','#3d6c37']},
  coll:{g:['#6aa04c','#76ac57','#5f9444','#80b861','#558a3d'],hw:0,hv:0,bk:0,cl:0,pr:{g:'#2f6b2a',G:'#4f9a3c'},mm:['#76ac57','#5f9444','#6aa04c']},
  // Réglages facultatifs d’un aspect : sa = couleurs du sable (berges) · dc = couleurs du décor (d : foncé, l : clair) · td = densité d’arbres (x, y) → 0 à 1 (sans td : bosquets au hasard)
  rives:{g:['#72ad4b','#7eb955','#659f40','#8dc460','#578f35'],hw:9,hv:5,bk:6,cl:0,pr:{g:'#2c6a2b',G:'#55a23f'},mm:['#7eb955','#659f40','#72ad4b'],
   td:(x,y)=>clamp((Math.abs(y-800)-210)/170,0,.95)},
  lac:{g:['#62944a','#6c9e53','#588a41','#74a85b','#4e7b39'],hw:0,hv:0,bk:0,cl:0,pr:{g:'#2f6b2a',G:'#4f9a3c'},mm:MM0},
  bocage:{g:['#5f9444','#6aa04c','#558a3d','#76ac57','#4a7b34'],hw:8,hv:6,bk:5,cl:0,pr:{g:'#2a5f2a',G:'#468a38'},mm:['#6aa04c','#558a3d','#5f9444'],
   sa:['#8c8a80','#9a988e','#7a786e','#b0aea4'],dc:{d:'#3f6a2e',l:'#8cbf6a'},
   td:(x,y)=>Math.abs(y-800)>85&&(Math.abs(((x+70)%380)-190)>172||Math.abs(((y+40)%340)-170)>158)?.95:.012}
 },
 DIRT=['#b99d66','#c4a96f','#ad9159','#9c8250','#8a7048'],   // chemin : base, claire, sombre, grains, bord
 SAND=['#e3d49b','#d9cc92','#cbb98a','#b9ad88'],
 WAT=['#3b82c4','#4d9bd6','#7ec3ea','#dff4fa','#8fd0f0','#2f6fb0'],   // eau : profonde, moyenne, claire, écume, reflet, sombre
 WOOD=['#a8743a','#8d5e2c','#4a2f17','#c08a4e'],
 // Petits décors en pixels de sol : [dx, dy, clé de couleur]
 SP={
  tuft:[[0,0,'d'],[2,0,'d'],[1,1,'d']],tuftL:[[1,0,'l'],[0,1,'l'],[2,1,'l']],
  fern:[[2,0,'f'],[1,1,'f'],[2,1,'F'],[3,1,'f'],[0,2,'f'],[2,2,'F'],[4,2,'f']],
  mush:[[0,0,'w'],[1,0,'W'],[2,0,'w'],[1,1,'s']],
  rock:[[1,0,'a'],[2,0,'a'],[0,1,'a'],[1,1,'A'],[2,1,'A'],[3,1,'b'],[0,2,'b'],[1,2,'b'],[2,2,'b'],[3,2,'b']],
  boulder:[[1,0,'a'],[2,0,'A'],[3,0,'a'],[0,1,'a'],[1,1,'A'],[2,1,'A'],[3,1,'a'],[4,1,'b'],[0,2,'a'],[1,2,'a'],[2,2,'a'],[3,2,'b'],[4,2,'b'],[1,3,'b'],[2,3,'b'],[3,3,'b']],
  reed:[[0,0,'t'],[0,1,'r'],[0,2,'r'],[0,3,'r'],[1,2,'R'],[1,3,'R'],[2,3,'r']],
  stone:[[0,0,'a'],[1,0,'A'],[0,1,'b'],[1,1,'b']],
  lily:[[0,0,'P'],[1,0,'P'],[2,0,'P'],[0,1,'p'],[1,1,'p'],[2,1,'p'],[1,0,'Y']],
  log:[[0,0,'q'],[1,0,'q'],[2,0,'q'],[3,0,'q'],[4,0,'q'],[0,1,'Q'],[1,1,'Q'],[2,1,'Q'],[3,1,'Q'],[4,1,'Q']],
  fw:[[0,0,'1']],fy:[[0,0,'2']],fl:[[0,0,'3']],fp:[[1,0,'1'],[0,1,'1'],[2,1,'1'],[1,2,'1'],[1,1,'2']],fq:[[0,0,'1'],[1,0,'1'],[0,1,'g'],[1,1,'2']]
 },
 // Courbe lisse (Catmull-Rom) par des points de contrôle en pixels de monde → points en pixels de sol
 curve=P=>{const o=[],q=P.map(([x,y])=>[x/GP,y/GP]);
  for(let k=0;k<q.length-1;k++){const p0=q[Math.max(0,k-1)],p1=q[k],p2=q[k+1],p3=q[Math.min(q.length-1,k+2)],st=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])));
   for(let j=0;j<st;j++){const t=j/st;o.push([0,1].map(a=>.5*(2*p1[a]+(-p0[a]+p2[a])*t+(2*p0[a]-5*p1[a]+4*p2[a]-p3[a])*t*t+(-p0[a]+3*p1[a]-3*p2[a]+p3[a])*t*t*t)))}}
  o.push(q[q.length-1]);return o},
 // Distance (en pixels de sol, jusqu’à R) à une série de points
 stamp=(d,pts,R)=>{const r2=R*R;for(const[cx,cy]of pts){const y0=Math.max(0,Math.floor(cy-R)),y1=Math.min(N-1,Math.ceil(cy+R)),x0=Math.max(0,Math.floor(cx-R)),x1=Math.min(N-1,Math.ceil(cx+R));
   for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=x-cx,dy=y-cy,q=dx*dx+dy*dy;if(q<r2){const i=y*N+x,v=Math.sqrt(q);if(v<d[i])d[i]=v}}}},
 // Mélange de deux couleurs RGBA (entiers) : a = part de t
 lerp=(c,t,a)=>{const r=c&255,g=(c>>8)&255,b=(c>>16)&255;return(255<<24|(b+(((t>>16)&255)-b)*a|0)<<16|(g+(((t>>8)&255)-g)*a|0)<<8|(r+((t&255)-r)*a|0))>>>0},

/* nav.js — déplacements et terrain : eau et lave infranchissables, neige et montagne lentes, contournement des obstacles.
 * Script classique (pas de module ES) : définit l’objet global `Nav`. À charger après terrain.js (voir index.html).
